<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDBATE · teams & top 3</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 1.5rem;
        }

        .app-container {
            display: flex;
            max-width: 1300px;
            width: 100%;
            gap: 1.5rem;
        }

        /* ---------- SIDEBAR (deep gray + orange) ---------- */
        .sidebar {
            flex: 1;
            max-width: 320px;
            background: #1e1e2e;
            border-radius: 32px;
            padding: 2rem 1.5rem;
            color: #e0e0e0;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            height: fit-content;
        }

        .sidebar h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #f57c00;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sidebar h2 i {
            font-size: 2rem;
        }

        .stat-card-side {
            background: #2d2d3a;
            border-radius: 24px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            border-left: 6px solid #f57c00;
        }

        .stat-side-value {
            font-size: 2rem;
            font-weight: 800;
            color: white;
        }

        .stat-side-label {
            color: #f57c00;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.03em;
        }

        .teams-section {
            margin-top: 2rem;
        }

        .teams-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .teams-header h3 {
            color: #f57c00;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .add-team-btn {
            background: #f57c00;
            color: #1e1e2e;
            border: none;
            border-radius: 30px;
            width: 36px;
            height: 36px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s;
        }

        .add-team-btn:hover {
            background: #ff9500;
        }

        .team-card {
            background: #2d2d3a;
            border-radius: 24px;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
        }

        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .team-name {
            font-weight: 700;
            color: white;
            font-size: 1.2rem;
        }

        .team-actions button {
            background: none;
            border: none;
            color: #f57c00;
            font-size: 1.1rem;
            margin-left: 0.5rem;
            cursor: pointer;
        }

        .team-member-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e2e;
            border-radius: 40px;
            padding: 0.5rem 1rem;
            margin-bottom: 0.5rem;
        }

        .team-member-row .name {
            font-weight: 500;
            color: #e0e0e0;
        }

        .team-member-row .points {
            background: #f57c00;
            color: #1e1e2e;
            font-weight: 700;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.85rem;
        }

        .member-edit {
            display: flex;
            gap: 0.3rem;
        }

        .member-edit button {
            background: none;
            border: none;
            color: #f57c00;
            font-size: 1rem;
            cursor: pointer;
        }

        /* ---------- MAIN CONTENT ---------- */
        .main-content {
            flex: 3;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            padding: 2rem;
        }

        .main-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1e1e2e;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .main-header h1 i {
            color: #f57c00;
            font-size: 2.5rem;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 1.5rem;
            font-size: 1rem;
            border-left: 4px solid #f57c00;
            padding-left: 1rem;
        }

        /* Top 3 podium */
        .top3-section {
            background: #f8fafc;
            border-radius: 32px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }

        .top3-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
        }

        .top3-header h3 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e1e2e;
        }

        .top3-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .podium-item {
            background: white;
            border-radius: 30px;
            padding: 1.2rem;
            text-align: center;
            border: 2px solid #e2e8f0;
            position: relative;
        }

        .podium-item.first {
            border-color: #f57c00;
            background: #fff7ed;
        }

        .podium-rank {
            font-size: 2rem;
            font-weight: 800;
            color: #f57c00;
            margin-bottom: 0.5rem;
        }

        .podium-name {
            font-weight: 700;
            font-size: 1.2rem;
            color: #1e1e2e;
        }

        .podium-points {
            font-weight: 600;
            color: #64748b;
            margin-top: 0.3rem;
        }

        /* rest unchanged (input, top10, table) */
        .input-section {
            background: #f8fafc;
            border-radius: 24px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: flex-end;
        }

        .input-field {
            flex: 2 1 200px;
        }

        .input-field label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #475569;
            margin-bottom: 0.3rem;
        }

        .input-field input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 2px solid #e2e8f0;
            border-radius: 40px;
            font-size: 1rem;
            background: white;
            transition: 0.2s;
        }

        .input-field input:focus {
            outline: none;
            border-color: #f57c00;
            box-shadow: 0 0 0 3px rgba(245,158,11,0.2);
        }

        .points-field {
            flex: 1 1 120px;
        }

        .add-btn {
            flex: 0 0 auto;
            background: #f57c00;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 0.9rem 2rem;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 8px 20px rgba(245,158,11,0.3);
            height: 54px;
            white-space: nowrap;
        }

        .add-btn:hover {
            background: #e07c00;
        }

        .add-btn:active {
            transform: scale(0.97);
        }

        .info-note {
            font-size:0.85rem; color:#64748b; margin-top:0.75rem;
        }
        .info-note i {
            color: #f57c00;
        }

        .top10-section {
            background: #f8fafc;
            border-radius: 24px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }

        .top10-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .top10-header h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1e1e2e;
        }

        .top10-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.8rem;
        }

        .top10-item {
            background: white;
            border-radius: 40px;
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            border: 1px solid #e2e8f0;
        }

        .top10-rank {
            font-weight: 800;
            color: #f57c00;
            font-size: 1.2rem;
            min-width: 2rem;
        }

        .top10-name {
            flex: 1;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top10-points {
            font-weight: 700;
            color: #1e1e2e;
            background: #f1f5f9;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            font-size: 0.9rem;
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .leaderboard-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e1e2e;
        }

        .reset-btn {
            background: none;
            border: 2px solid #e2e8f0;
            color: #64748b;
            border-radius: 40px;
            padding: 0.5rem 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .reset-btn:hover {
            border-color: #f57c00;
            color: #f57c00;
            background: #fff7ed;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #edf2f7;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #f8fafc;
            color: #334155;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            padding: 1rem 1rem;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 1rem 1rem;
            border-bottom: 1px solid #edf2f7;
            color: #1e293b;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .rank {
            font-weight: 800;
            color: #f57c00;
            width: 60px;
        }

        .name {
            font-weight: 600;
        }

        .points {
            font-weight: 700;
            color: #1e1e2e;
        }

        .actions {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .edit-btn, .delete-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
            padding: 0.3rem;
        }

        .edit-btn { color: #3b82f6; }
        .edit-btn:hover { color: #1e4f8a; }

        .delete-btn { color: #ef4444; }
        .delete-btn:hover { color: #b91c1c; }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #94a3b8;
            font-style: italic;
        }

        @media (max-width: 900px) {
            .app-container {
                flex-direction: column;
            }
            .sidebar {
                max-width: 100%;
            }
        }

        /* ---------- CUSTOM MODAL STYLES ---------- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-box {
            background: #1e1e2e;
            border-radius: 32px;
            padding: 2rem;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border: 2px solid #f57c00;
            color: #e0e0e0;
        }
        .modal-box h3 {
            color: #f57c00;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }
        .modal-box p {
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .modal-box input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: #2d2d3a;
            border: 2px solid #40405c;
            border-radius: 40px;
            color: white;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }
        .modal-box input:focus {
            outline: none;
            border-color: #f57c00;
        }
        .modal-actions {
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
        }
        .modal-btn {
            padding: 0.7rem 1.5rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .modal-btn.confirm {
            background: #f57c00;
            color: #1e1e2e;
        }
        .modal-btn.cancel {
            background: #2d2d3a;
            color: #e0e0e0;
            border: 1px solid #40405c;
        }
        .modal-btn.confirm:hover { background: #ff9500; }
        .modal-btn.cancel:hover { background: #3d3d4d; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR with dashboard + teams -->
        <aside class="sidebar">
            <h2><i class="fa-regular fa-chart-bar"></i> DASHBOARD</h2>
            <div class="stat-card-side" id="sidebarStats"></div>

            <div class="teams-section">
                <div class="teams-header">
                    <h3><i class="fa-regular fa-users"></i> TEAMS</h3>
                    <button class="add-team-btn" id="addTeamBtn" title="Add new team"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div id="teamsContainer"></div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <div class="main-header">
                <h1><i class="fa-regular fa-microphone"></i> IDBATE COMPETITION</h1>
                <div class="subtitle">Add speakers (max 90 pts) · Top 3 podium · Top 10 · Full leaderboard</div>
            </div>

            <!-- Add speaker form -->
            <div class="input-section">
                <div class="input-row">
                    <div class="input-field">
                        <label><i class="fa-regular fa-user"></i> Speaker name</label>
                        <input type="text" id="speakerName" placeholder="e.g., Jane Doe" autocomplete="off">
                    </div>
                    <div class="input-field points-field">
                        <label><i class="fa-regular fa-star"></i> Points (≤90)</label>
                        <input type="number" id="speakerPoints" placeholder="0" min="0" max="90" step="0.1" value="0">
                    </div>
                    <button class="add-btn" id="addBtn"><i class="fa-solid fa-plus"></i> Add / Update</button>
                </div>
                <div class="info-note"><i class="fa-regular fa-circle-info"></i> Max 90 points. If name exists, points updated.</div>
            </div>

            <!-- TOP 3 PODIUM -->
            <div class="top3-section">
                <div class="top3-header"><i class="fa-solid fa-crown" style="color:#f57c00;"></i><h3>Top 3 speakers</h3></div>
                <div class="top3-grid" id="top3Grid"></div>
            </div>

            <!-- TOP 10 LIST -->
            <div class="top10-section">
                <div class="top10-header"><i class="fa-solid fa-trophy"></i><h3>Top 10 speakers</h3></div>
                <div class="top10-grid" id="top10Grid"></div>
            </div>

            <!-- FULL LEADERBOARD -->
            <div class="leaderboard-header">
                <h2><i class="fa-regular fa-list"></i> All speakers</h2>
                <button class="reset-btn" id="resetBtn"><i class="fa-regular fa-trash-can"></i> Reset all</button>
            </div>
            <div class="table-container" id="tableContainer"></div>
        </main>
    </div>

    <!-- CUSTOM MODAL (hidden by default) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox">
            <h3 id="modalTitle">Title</h3>
            <p id="modalMessage">Message</p>
            <input type="text" id="modalInput" placeholder="Enter value" style="display: none;">
            <div class="modal-actions">
                <button class="modal-btn cancel" id="modalCancel">Cancel</button>
                <button class="modal-btn confirm" id="modalConfirm">OK</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- CUSTOM MODAL IMPLEMENTATION ----------
            const overlay = document.getElementById('modalOverlay');
            const modalBox = document.getElementById('modalBox');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalInput = document.getElementById('modalInput');
            const modalCancel = document.getElementById('modalCancel');
            const modalConfirm = document.getElementById('modalConfirm');

            let currentResolve = null;
            let currentReject = null;

            function hideModal() {
                overlay.style.display = 'none';
                modalInput.style.display = 'none';
                modalInput.value = '';
                currentResolve = null;
                currentReject = null;
            }

            // alert
            window.modalAlert = function(message, title = 'Notice') {
                return new Promise((resolve) => {
                    modalTitle.innerText = title;
                    modalMessage.innerText = message;
                    modalInput.style.display = 'none';
                    modalCancel.style.display = 'none';
                    modalConfirm.innerText = 'OK';
                    overlay.style.display = 'flex';

                    const onConfirm = () => {
                        hideModal();
                        modalConfirm.removeEventListener('click', onConfirm);
                        resolve();
                    };
                    modalConfirm.addEventListener('click', onConfirm, { once: true });
                });
            };

            // confirm
            window.modalConfirm = function(message, title = 'Confirm') {
                return new Promise((resolve) => {
                    modalTitle.innerText = title;
                    modalMessage.innerText = message;
                    modalInput.style.display = 'none';
                    modalCancel.style.display = 'inline-block';
                    modalConfirm.innerText = 'Yes';
                    modalCancel.innerText = 'Cancel';
                    overlay.style.display = 'flex';

                    const onConfirm = () => {
                        hideModal();
                        modalConfirm.removeEventListener('click', onConfirm);
                        modalCancel.removeEventListener('click', onCancel);
                        resolve(true);
                    };
                    const onCancel = () => {
                        hideModal();
                        modalConfirm.removeEventListener('click', onConfirm);
                        modalCancel.removeEventListener('click', onCancel);
                        resolve(false);
                    };
                    modalConfirm.addEventListener('click', onConfirm, { once: true });
                    modalCancel.addEventListener('click', onCancel, { once: true });
                });
            };

            // prompt
            window.modalPrompt = function(message, defaultValue = '', title = 'Input') {
                return new Promise((resolve) => {
                    modalTitle.innerText = title;
                    modalMessage.innerText = message;
                    modalInput.style.display = 'block';
                    modalInput.value = defaultValue;
                    modalCancel.style.display = 'inline-block';
                    modalConfirm.innerText = 'Submit';
                    modalCancel.innerText = 'Cancel';
                    overlay.style.display = 'flex';
                    modalInput.focus();

                    const onConfirm = () => {
                        const val = modalInput.value;
                        hideModal();
                        modalConfirm.removeEventListener('click', onConfirm);
                        modalCancel.removeEventListener('click', onCancel);
                        resolve(val);
                    };
                    const onCancel = () => {
                        hideModal();
                        modalConfirm.removeEventListener('click', onConfirm);
                        modalCancel.removeEventListener('click', onCancel);
                        resolve(null);
                    };
                    modalConfirm.addEventListener('click', onConfirm, { once: true });
                    modalCancel.addEventListener('click', onCancel, { once: true });
                    modalInput.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            onConfirm();
                        }
                    });
                });
            };

            // Close modal when clicking overlay (optional, but we'll disable to prevent accidental close)
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    // optionally close, but better to require explicit action
                }
            });

            // ---------- STORAGE KEYS ----------
            const SPEAKERS_KEY = 'idbate_speakers';
            const TEAMS_KEY = 'idbate_teams';

            // ---------- DEFAULT DATA ----------
            let speakers = [
                { id: '1', name: 'Alex Rivera', points: 89.5 },
                { id: '2', name: 'Jordan Lee', points: 88.0 },
                { id: '3', name: 'Taylor Smith', points: 76.8 },
                { id: '4', name: 'Casey Kim', points: 85.2 },
                { id: '5', name: 'Morgan Chase', points: 81.3 },
                { id: '6', name: 'Riley Parker', points: 67.5 },
                { id: '7', name: 'Jamie Chen', points: 89.4 },
                { id: '8', name: 'Sam Johnson', points: 73.2 },
                { id: '9', name: 'Chris Evans', points: 84.7 },
                { id: '10', name: 'Pat Smith', points: 90.0 },
                { id: '11', name: 'Terry Gale', points: 62.3 }
            ];

            let teams = [
                { id: 'team1', name: 'Team Phoenix', members: [
                    { name: 'Alex Rivera', points: 89.5 },
                    { name: 'Jordan Lee', points: 88.0 },
                    { name: 'Casey Kim', points: 85.2 }
                ]}
            ];

            // Load from localStorage
            function loadData() {
                const storedSpeakers = localStorage.getItem(SPEAKERS_KEY);
                if (storedSpeakers) {
                    try { speakers = JSON.parse(storedSpeakers); } catch(e){}
                } else {
                    localStorage.setItem(SPEAKERS_KEY, JSON.stringify(speakers));
                }

                const storedTeams = localStorage.getItem(TEAMS_KEY);
                if (storedTeams) {
                    try { teams = JSON.parse(storedTeams); } catch(e){}
                } else {
                    localStorage.setItem(TEAMS_KEY, JSON.stringify(teams));
                }
            }
            loadData();

            function saveSpeakers() {
                localStorage.setItem(SPEAKERS_KEY, JSON.stringify(speakers));
            }
            function saveTeams() {
                localStorage.setItem(TEAMS_KEY, JSON.stringify(teams));
            }

            // Escape helper
            function escapeHtml(unsafe) {
                return unsafe.replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            // Render sidebar stats
            function renderSidebarStats() {
                const totalSpeakers = speakers.length;
                const totalPoints = speakers.reduce((sum, s) => sum + s.points, 0);
                const avgPoints = totalSpeakers ? (totalPoints / totalSpeakers).toFixed(1) : 0;
                const maxPoints = speakers.length ? Math.max(...speakers.map(s => s.points)) : 0;
                const minPoints = speakers.length ? Math.min(...speakers.map(s => s.points)) : 0;

                document.getElementById('sidebarStats').innerHTML = `
                    <div style="margin-bottom:1rem;"><div class="stat-side-value">${totalSpeakers}</div><div class="stat-side-label">Total speakers</div></div>
                    <div style="margin-bottom:1rem;"><div class="stat-side-value">${totalPoints.toFixed(1)}</div><div class="stat-side-label">Total points</div></div>
                    <div style="margin-bottom:1rem;"><div class="stat-side-value">${avgPoints}</div><div class="stat-side-label">Average</div></div>
                    <div style="margin-bottom:1rem;"><div class="stat-side-value">${maxPoints.toFixed(1)}</div><div class="stat-side-label">Highest</div></div>
                    <div><div class="stat-side-value">${minPoints.toFixed(1)}</div><div class="stat-side-label">Lowest</div></div>
                `;
            }

            // Render teams in sidebar
            function renderTeams() {
                const container = document.getElementById('teamsContainer');
                if (teams.length === 0) {
                    container.innerHTML = '<p style="color:#aaa; text-align:center;">No teams yet. Click + to add.</p>';
                    return;
                }

                let html = '';
                teams.forEach(team => {
                    html += `<div class="team-card" data-team-id="${team.id}">
                        <div class="team-header">
                            <span class="team-name">${escapeHtml(team.name)}</span>
                            <div class="team-actions">
                                <button onclick="editTeam('${team.id}')" title="Edit team"><i class="fa-regular fa-pen-to-square"></i></button>
                                <button onclick="deleteTeam('${team.id}')" title="Delete team"><i class="fa-regular fa-trash-can"></i></button>
                            </div>
                        </div>`;
                    team.members.forEach((member, idx) => {
                        html += `<div class="team-member-row">
                            <span class="name">${escapeHtml(member.name)}</span>
                            <span class="points">${member.points.toFixed(1)}</span>
                            <div class="member-edit">
                                <button onclick="editMember('${team.id}', ${idx})" title="Edit member"><i class="fa-regular fa-pen-to-square"></i></button>
                                <button onclick="deleteMember('${team.id}', ${idx})" title="Delete member"><i class="fa-regular fa-trash-can"></i></button>
                            </div>
                        </div>`;
                    });
                    html += `<button class="add-member-btn" style="background:#f57c00; border:none; border-radius:30px; color:#1e1e2e; padding:0.4rem 1rem; margin-top:0.5rem; width:100%; font-weight:600; cursor:pointer;" onclick="addMemberPrompt('${team.id}')">+ Add member</button>`;
                    html += `</div>`;
                });
                container.innerHTML = html;
            }

            // Global functions for team actions (to be used in onclick)
            window.editTeam = async function(teamId) {
                const team = teams.find(t => t.id === teamId);
                if (!team) return;
                const newName = await modalPrompt('Edit team name:', team.name, 'Edit team');
                if (newName && newName.trim()) {
                    team.name = newName.trim();
                    saveTeams();
                    renderTeams();
                }
            };

            window.deleteTeam = async function(teamId) {
                const confirmed = await modalConfirm('Delete this team and all its members?', 'Confirm deletion');
                if (confirmed) {
                    teams = teams.filter(t => t.id !== teamId);
                    saveTeams();
                    renderTeams();
                }
            };

            window.editMember = async function(teamId, memberIdx) {
                const team = teams.find(t => t.id === teamId);
                if (!team) return;
                const member = team.members[memberIdx];
                const newName = await modalPrompt('Edit member name:', member.name, 'Edit member');
                if (newName && newName.trim()) member.name = newName.trim();
                const newPoints = await modalPrompt('Edit points (max 90):', member.points, 'Edit points');
                if (newPoints !== null) {
                    const pts = parseFloat(newPoints);
                    if (!isNaN(pts) && pts >= 0 && pts <= 90) {
                        member.points = pts;
                    } else {
                        await modalAlert('Points must be 0-90', 'Invalid input');
                    }
                }
                saveTeams();
                renderTeams();
            };

            window.deleteMember = async function(teamId, memberIdx) {
                const team = teams.find(t => t.id === teamId);
                if (team) {
                    const confirmed = await modalConfirm('Remove this member?', 'Confirm');
                    if (confirmed) {
                        team.members.splice(memberIdx, 1);
                        saveTeams();
                        renderTeams();
                    }
                }
            };

            window.addMemberPrompt = async function(teamId) {
                const team = teams.find(t => t.id === teamId);
                if (!team) return;
                const name = await modalPrompt('Enter member name:', '', 'New member');
                if (!name || !name.trim()) return;
                const points = await modalPrompt('Enter points (max 90):', '0', 'Points');
                const pts = parseFloat(points);
                if (isNaN(pts) || pts < 0 || pts > 90) {
                    await modalAlert('Points must be 0-90', 'Invalid');
                    return;
                }
                team.members.push({ name: name.trim(), points: pts });
                saveTeams();
                renderTeams();
            };

            // Add new team
            document.getElementById('addTeamBtn').addEventListener('click', async function() {
                const teamName = await modalPrompt('Enter new team name:', '', 'New team');
                if (!teamName || !teamName.trim()) return;
                teams.push({
                    id: Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                    name: teamName.trim(),
                    members: []
                });
                saveTeams();
                renderTeams();
            });

            // Render Top 3
            function renderTop3() {
                const sorted = [...speakers].sort((a,b) => b.points - a.points);
                const top3 = sorted.slice(0, 3);
                const grid = document.getElementById('top3Grid');
                if (top3.length === 0) {
                    grid.innerHTML = '<p style="color:#94a3b8;">No speakers yet.</p>';
                    return;
                }
                grid.innerHTML = top3.map((s, idx) => {
                    let rankClass = '';
                    if (idx === 0) rankClass = 'first';
                    return `<div class="podium-item ${rankClass}">
                        <div class="podium-rank">#${idx+1}</div>
                        <div class="podium-name">${escapeHtml(s.name)}</div>
                        <div class="podium-points">${s.points.toFixed(1)} pts</div>
                    </div>`;
                }).join('');
            }

            // Render Top 10
            function renderTop10() {
                const sorted = [...speakers].sort((a,b) => b.points - a.points);
                const top10 = sorted.slice(0, 10);
                const grid = document.getElementById('top10Grid');
                if (top10.length === 0) {
                    grid.innerHTML = '<p style="color:#94a3b8;">No speakers yet.</p>';
                    return;
                }
                grid.innerHTML = top10.map((s, idx) => {
                    return `<div class="top10-item">
                        <span class="top10-rank">#${idx+1}</span>
                        <span class="top10-name">${escapeHtml(s.name)}</span>
                        <span class="top10-points">${s.points.toFixed(1)}</span>
                    </div>`;
                }).join('');
            }

            // Render full table
            function renderFullTable() {
                const sorted = [...speakers].sort((a,b) => b.points - a.points);
                const container = document.getElementById('tableContainer');
                if (sorted.length === 0) {
                    container.innerHTML = `<div class="empty-state"><i class="fa-regular fa-face-smile"></i> No speakers yet. Add one above!</div>`;
                    return;
                }
                let html = `<table><thead><tr><th>Rank</th><th>Speaker</th><th>Points</th><th>Actions</th></tr></thead><tbody>`;
                sorted.forEach((speaker, index) => {
                    html += `<tr data-id="${speaker.id}">
                        <td class="rank">#${index+1}</td>
                        <td class="name">${escapeHtml(speaker.name)}</td>
                        <td class="points">${speaker.points.toFixed(1)}</td>
                        <td class="actions">
                            <button class="edit-btn" onclick="editSpeaker('${speaker.id}')" title="Edit"><i class="fa-regular fa-pen-to-square"></i></button>
                            <button class="delete-btn" onclick="deleteSpeaker('${speaker.id}')" title="Delete"><i class="fa-regular fa-trash-can"></i></button>
                        </td>
                    </tr>`;
                });
                html += `</tbody></table>`;
                container.innerHTML = html;
            }

            // Global speaker functions
            window.editSpeaker = function(id) {
                const speaker = speakers.find(s => s.id === id);
                if (speaker) {
                    document.getElementById('speakerName').value = speaker.name;
                    document.getElementById('speakerPoints').value = speaker.points;
                }
            };

            window.deleteSpeaker = async function(id) {
                const confirmed = await modalConfirm('Delete this speaker?', 'Confirm deletion');
                if (confirmed) {
                    speakers = speakers.filter(s => s.id !== id);
                    saveSpeakers();
                    renderAll();
                }
            };

            // Add/update speaker
            async function addOrUpdateSpeaker(name, points) {
                if (!name.trim()) {
                    await modalAlert('Please enter a speaker name.', 'Missing name');
                    return false;
                }
                const numPoints = parseFloat(points);
                if (isNaN(numPoints) || numPoints < 0 || numPoints > 90) {
                    await modalAlert('Points must be 0-90.', 'Invalid points');
                    return false;
                }
                const existing = speakers.findIndex(s => s.name.toLowerCase() === name.trim().toLowerCase());
                if (existing !== -1) {
                    speakers[existing].points = numPoints;
                } else {
                    speakers.push({
                        id: Date.now() + '-' + Math.random().toString(36).substr(2,9),
                        name: name.trim(),
                        points: numPoints
                    });
                }
                saveSpeakers();
                renderAll();
                return true;
            }

            // Reset all speakers
            async function resetAll() {
                const confirmed = await modalConfirm('Delete all speakers? This cannot be undone.', 'Reset confirmation');
                if (confirmed) {
                    speakers = [];
                    saveSpeakers();
                    renderAll();
                }
            }

            // Render everything
            function renderAll() {
                renderSidebarStats();
                renderTeams();
                renderTop3();
                renderTop10();
                renderFullTable();
            }

            // Event listeners
            document.getElementById('addBtn').addEventListener('click', async function() {
                const name = document.getElementById('speakerName').value;
                const points = document.getElementById('speakerPoints').value;
                if (await addOrUpdateSpeaker(name, points)) {
                    document.getElementById('speakerName').value = '';
                    document.getElementById('speakerPoints').value = '0';
                }
            });

            document.getElementById('speakerName').addEventListener('keypress', e => e.key === 'Enter' && document.getElementById('addBtn').click());
            document.getElementById('speakerPoints').addEventListener('keypress', e => e.key === 'Enter' && document.getElementById('addBtn').click());
            document.getElementById('resetBtn').addEventListener('click', resetAll);

            // Initial render
            renderAll();
        })();
    </script>
</body>
</html>
