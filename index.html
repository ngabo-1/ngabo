<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDBATE · accessible debate manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ========== base reset – keep original look ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* accessible outline & focus */
        :focus-visible {
            outline: 3px solid #f57c00;
            outline-offset: 3px;
            border-radius: 4px;
        }

        /* skip link */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #1e1e2e;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 0 0 8px 0;
            z-index: 10000;
            transition: top 0.2s;
        }
        .skip-link:focus {
            top: 0;
            outline: 3px solid #f57c00;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 1.5rem;
        }

        .app-container {
            display: flex;
            max-width: 1400px;
            width: 100%;
            gap: 1.5rem;
            transition: all 0.3s ease;
        }

        /* SIDEBAR – dark with orange (contrast ~11:1) */
        .sidebar {
            flex: 0 0 320px;
            background: #1e1e2e;
            border-radius: 32px;
            padding: 2rem 1.5rem;
            color: #f0f0f0;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            height: fit-content;
            transition: all 0.3s ease;
            position: relative;
        }

        .sidebar.collapsed {
            flex: 0 0 80px;
            padding: 2rem 1rem;
            overflow: hidden;
        }

        .sidebar.collapsed h2 span,
        .sidebar.collapsed .podium-mini,
        .sidebar.collapsed .stat-card-side,
        .sidebar.collapsed .teams-section {
            display: none;
        }

        .sidebar .toggle-btn {
            position: absolute;
            top: 20px;
            right: -12px;
            background: #f57c00;
            color: #1e1e2e;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid #1e1e2e;
            z-index: 10;
            transition: 0.2s;
            font-size: 1rem;
        }
        .sidebar .toggle-btn:hover { background: #ff9500; }
        .sidebar .toggle-btn:focus-visible { outline: 2px solid white; }

        .sidebar h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #f57c00;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .podium-mini {
            background: #2d2d3a;
            border-radius: 24px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            border-left: 6px solid #f57c00;
        }
        .podium-mini h4 {
            color: #f57c00;
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .podium-mini-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e2e;
            border-radius: 40px;
            padding: 0.5rem 1rem;
            margin-bottom: 0.5rem;
        }
        .podium-mini-item .rank { font-weight: 800; color: #f57c00; width: 2rem; }
        .podium-mini-item .name { flex:1; font-weight:500; color:white; }
        .podium-mini-item .points {
            background: #f57c00; color: #1e1e2e; font-weight:700; padding:0.2rem 0.8rem; border-radius:40px; font-size:0.8rem;
        }

        .stat-card-side {
            background: #2d2d3a; border-radius:24px; padding:1.2rem; margin-bottom:1rem; border-left:6px solid #f57c00;
        }
        .stat-row { display:flex; justify-content:space-between; padding:0.5rem 0; border-bottom:1px solid #40405c; }
        .stat-label { color:#cccccc; }
        .stat-value { color:white; font-weight:700; font-size:1.2rem; }

        .teams-section { margin-top:2rem; }
        .teams-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
        .teams-header h3 { color:#f57c00; font-size:1.3rem; display:flex; align-items:center; gap:0.5rem; }
        .add-team-btn {
            background:#f57c00; color:#1e1e2e; border:none; border-radius:30px; width:36px; height:36px;
            font-size:1.5rem; display:flex; align-items:center; justify-content:center; cursor:pointer; font-weight:700; transition:0.2s;
        }
        .add-team-btn:hover { background:#ff9500; }

        .team-card {
            background:#2d2d3a; border-radius:28px; padding:1.2rem; margin-bottom:1.2rem; border:2px solid transparent; box-shadow:0 6px 12px rgba(0,0,0,0.3);
        }
        .team-card:hover { border-color:#f57c00; }
        .team-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
        .team-name {
            font-weight:700; color:white; font-size:1.3rem; background:#1e1e2e; padding:0.3rem 1rem; border-radius:40px; border-left:4px solid #f57c00;
        }
        .team-actions button {
            background:none; border:none; color:#f57c00; font-size:1.2rem; margin-left:0.5rem; cursor:pointer;
        }
        .team-actions button:hover { color:#ff9500; }

        .member-slot {
            display:flex; align-items:center; gap:0.5rem; background:#1e1e2e; border-radius:40px; padding:0.5rem 1rem; border:1px solid #40405c;
        }
        .member-slot .slot-number { color:#f57c00; font-weight:700; min-width:2rem; }
        .member-slot .name { flex:2; font-weight:500; color:#f0f0f0; }
        .member-slot .points {
            background:#f57c00; color:#1e1e2e; font-weight:700; padding:0.2rem 0.8rem; border-radius:40px; font-size:0.85rem; min-width:4rem; text-align:center;
        }
        .member-slot .edit-slot { background:none; border:none; color:#f57c00; font-size:1rem; cursor:pointer; }

        /* MAIN CONTENT */
        .main-content {
            flex:1; background:white; border-radius:32px; box-shadow:0 20px 40px rgba(0,0,0,0.05); padding:2rem;
        }
        .main-header h1 {
            font-size:2.5rem; font-weight:700; color:#1e1e2e; display:flex; align-items:center; gap:0.75rem; margin-bottom:0.5rem;
        }
        .main-header h1 i { color:#f57c00; font-size:2.5rem; }
        .subtitle { color:#2c3e50; margin-bottom:1.5rem; font-size:1rem; border-left:4px solid #f57c00; padding-left:1rem; }

        .tab-bar {
            display: flex; gap: 0.5rem; margin-bottom: 2rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem;
        }
        .tab {
            padding:0.6rem 1.8rem; border-radius:40px; font-weight:600; cursor:pointer; transition:0.2s;
            background:#f1f5f9; color:#1e293b; border:none; font-size:1rem;
        }
        .tab.active { background:#f57c00; color:#1e1e2e; }
        .tab:hover:not(.active) { background:#e2e8f0; }

        .input-section {
            background:#f8fafc; border-radius:24px; padding:1.5rem; margin-bottom:2rem; border:1px solid #e2e8f0;
        }
        .input-row { display:flex; flex-wrap:wrap; gap:0.75rem; align-items:flex-end; }
        .input-field { flex:2 1 200px; }
        .input-field label { display:block; font-size:0.8rem; font-weight:600; text-transform:uppercase; color:#2c3e50; margin-bottom:0.3rem; }
        .input-field input {
            width:100%; padding:0.9rem 1.2rem; border:2px solid #cbd5e1; border-radius:40px; font-size:1rem; background:white;
        }
        .input-field input:focus { border-color:#f57c00; box-shadow:0 0 0 3px rgba(245,124,0,0.2); }
        .points-field { flex:1 1 120px; }
        .add-btn {
            flex:0 0 auto; background:#f57c00; color:#1e1e2e; border:none; border-radius:40px; padding:0.9rem 2rem;
            font-weight:700; font-size:1rem; display:flex; align-items:center; gap:0.5rem; cursor:pointer; height:54px; white-space:nowrap;
        }
        .add-btn:hover { background:#e07c00; }

        .top3-section, .top10-section {
            background:#f8fafc; border-radius:32px; padding:1.5rem; margin-bottom:2rem; border:1px solid #e2e8f0;
        }
        .top3-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; }
        .podium-item {
            background:white; border-radius:30px; padding:1.2rem; text-align:center; border:2px solid #e2e8f0;
        }
        .podium-item.first { border-color:#f57c00; background:#fff7ed; }
        .podium-rank { font-size:2rem; font-weight:800; color:#f57c00; }
        .podium-name { font-weight:700; font-size:1.2rem; color:#1e1e2e; }

        .top10-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:0.8rem; }
        .top10-item {
            background:white; border-radius:40px; padding:0.8rem 1.2rem; display:flex; align-items:center; gap:0.8rem; border:1px solid #e2e8f0;
        }
        .top10-rank { font-weight:800; color:#f57c00; min-width:2rem; }

        .table-container { overflow-x:auto; border-radius:20px; border:1px solid #edf2f7; }
        table { width:100%; border-collapse:collapse; background:white; }
        th { background:#f8fafc; color:#1e293b; font-weight:600; padding:1rem; text-align:left; border-bottom:2px solid #cbd5e1; }
        td { padding:1rem; border-bottom:1px solid #edf2f7; }
        .rank-cell { font-weight:800; color:#f57c00; }
        .edit-btn { color:#f57c00; background:none; border:none; font-size:1.2rem; cursor:pointer; }
        .delete-btn { color:#b91c1c; background:none; border:none; font-size:1.2rem; cursor:pointer; }

        /* ROUNDS – accessible grouping */
        .bracket-container {
            display: flex; flex-direction: column; gap: 2rem;
        }
        .round-group {
            background: #f9fcff; border-radius: 32px; padding: 1.5rem; border: 2px solid #e2e8f0;
        }
        .group-title {
            font-size: 1.8rem; font-weight: 700; color: #1e1e2e; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem;
        }
        .group-title i { color: #f57c00; font-size: 2rem; }
        .round-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;
        }
        .round-card {
            background: #f8fafc; border-radius: 24px; padding: 1.2rem; border: 2px solid #e2e8f0;
        }
        .round-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px dashed #f57c00;
        }
        .round-header h4 { color: #f57c00; font-weight: 700; font-size: 1.1rem; }
        .round-header button {
            background: none; border: none; color: #f57c00; font-size: 1.3rem; cursor: pointer; padding: 0.2rem 0.5rem;
        }
        .round-header button:hover { color: #ff9500; }
        .round-teams { list-style: none; }
        .round-teams li {
            background: white; border-radius: 16px; padding: 0.8rem 1rem; margin-bottom: 0.6rem; border: 1px solid #e2e8f0;
        }
        .team-summary { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.3rem; }
        .team-summary button { background: none; border: none; color: #b91c1c; cursor: pointer; font-size: 1rem; }
        .member-tag { background: #f1f5f9; padding: 0.2rem 0.6rem; border-radius: 12px; color: #1e293b; }

        /* MODAL – accessible */
        .modal-overlay {
            position: fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(3px);
            display:none; justify-content:center; align-items:center; z-index:10000;
        }
        .modal-overlay.active { display:flex; }
        .modal-box {
            background:#1e1e2e; border-radius:32px; padding:2rem; max-width:500px; width:90%; box-shadow:0 25px 50px rgba(0,0,0,0.5);
            border:2px solid #f57c00; color:#e0e0e0; max-height:80vh; overflow-y:auto;
        }
        .modal-box h3 { color:#f57c00; margin-bottom:1.5rem; font-size:1.5rem; }
        .modal-box label { display:block; margin-top:1rem; margin-bottom:0.3rem; font-weight:600; color:#f57c00; }
        .modal-box input, .modal-box select {
            width:100%; padding:0.8rem 1.2rem; background:#2d2d3a; border:2px solid #40405c; border-radius:40px; color:white; font-size:1rem;
        }
        .modal-box input:focus { border-color:#f57c00; outline:2px solid #f57c00; }
        .modal-actions { display:flex; gap:0.8rem; justify-content:flex-end; margin-top:2rem; }
        .modal-btn {
            padding:0.7rem 1.5rem; border-radius:40px; font-weight:600; cursor:pointer; border:none; font-size:1rem;
        }
        .modal-btn.confirm { background:#f57c00; color:#1e1e2e; }
        .modal-btn.cancel { background:#2d2d3a; color:#e0e0e0; border:1px solid #40405c; }

        @media (max-width:1000px){ .app-container{flex-direction:column;} }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="app-container">
        <!-- SIDEBAR with ARIA label -->
        <aside class="sidebar" id="sidebar" aria-label="dashboard and teams">
            <div class="toggle-btn" id="toggleSidebar" role="button" tabindex="0" aria-label="collapse sidebar" aria-expanded="true">
                <i class="fa-solid fa-chevron-left" id="toggleIcon" aria-hidden="true"></i>
            </div>
            <h2><i class="fa-regular fa-chart-bar" aria-hidden="true"></i> <span>DASHBOARD</span></h2>
            <div class="podium-mini" id="miniPodium" aria-live="polite"></div>
            <div class="stat-card-side" id="sidebarStats"></div>
            <div class="teams-section">
                <div class="teams-header">
                    <h3><i class="fa-regular fa-users" aria-hidden="true"></i> <span>TEAMS</span></h3>
                    <button class="add-team-btn" id="addTeamBtn" aria-label="Add new team"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>
                </div>
                <div id="teamsContainer" aria-label="list of teams"></div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content" id="main-content">
            <div class="main-header">
                <h1><i class="fa-regular fa-microphone" aria-hidden="true"></i> IDBATE COMPETITION</h1>
                <div class="subtitle">Add speakers, form teams (max 3 members), and assign teams to rounds</div>
            </div>

            <!-- TAB LIST -->
            <div class="tab-bar" role="tablist" aria-label="competition views">
                <button class="tab active" id="tabRankings" role="tab" aria-selected="true" aria-controls="rankingsView">🏆 Speakers</button>
                <button class="tab" id="tabProgress" role="tab" aria-selected="false" aria-controls="progressView">📊 Round Assignments</button>
            </div>

            <!-- SPEAKERS PANEL -->
            <div class="rankings-view" id="rankingsView" role="tabpanel" aria-labelledby="tabRankings">
                <div class="input-section">
                    <div class="input-row">
                        <div class="input-field">
                            <label for="speakerName">Speaker name</label>
                            <input type="text" id="speakerName" placeholder="e.g., Jane Doe">
                        </div>
                        <div class="input-field points-field">
                            <label for="speakerPoints">Points (0-90)</label>
                            <input type="number" id="speakerPoints" placeholder="0" min="0" max="90" step="0.1" value="0">
                        </div>
                        <button class="add-btn" id="addBtn"><i class="fa-solid fa-plus" aria-hidden="true"></i> Add / Update</button>
                    </div>
                </div>

                <div class="top3-section">
                    <div class="top3-header"><i class="fa-solid fa-crown" style="color:#f57c00;" aria-hidden="true"></i><h3>Top 3 speakers</h3></div>
                    <div class="top3-grid" id="top3Grid"></div>
                </div>
                <div class="top10-section">
                    <div class="top10-header"><i class="fa-solid fa-trophy" style="color:#f57c00;" aria-hidden="true"></i><h3>Top 10 speakers</h3></div>
                    <div class="top10-grid" id="top10Grid"></div>
                </div>

                <div class="leaderboard-header">
                    <h2><i class="fa-regular fa-list" aria-hidden="true"></i> All speakers</h2>
                    <button class="reset-btn" id="resetBtn"><i class="fa-regular fa-trash-can" aria-hidden="true"></i> Reset all</button>
                </div>
                <div class="table-container" id="tableContainer"></div>
            </div>

            <!-- ROUNDS PANEL (accessibly grouped) -->
            <div class="progress-view" id="progressView" role="tabpanel" aria-labelledby="tabProgress" hidden>
                <h2 style="margin-bottom:1.5rem;"><i class="fa-regular fa-diagram-project" style="color:#f57c00;" aria-hidden="true"></i> Team Round Assignments</h2>
                <div class="bracket-container" id="bracketContainer"></div>
            </div>
        </main>
    </div>

    <!-- MODALS (labels added) -->
    <div class="modal-overlay" id="teamModal" role="dialog" aria-modal="true" aria-labelledby="teamModalTitle">
        <div class="modal-box">
            <h3 id="teamModalTitle">Add Team</h3>
            <form id="teamForm">
                <label for="teamNameInput">Team Name</label>
                <input type="text" id="teamNameInput" placeholder="e.g., Team Phoenix" required>

                <label for="member1Name" style="margin-top:1.5rem;">Member 1 (optional)</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="member1Name" placeholder="Name" style="flex: 2;">
                    <input type="number" id="member1Points" placeholder="Points" min="0" max="90" step="0.1" value="0" style="flex: 1;">
                </div>

                <label for="member2Name">Member 2 (optional)</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="member2Name" placeholder="Name" style="flex: 2;">
                    <input type="number" id="member2Points" placeholder="Points" min="0" max="90" step="0.1" value="0" style="flex: 1;">
                </div>

                <label for="member3Name">Member 3 (optional)</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="text" id="member3Name" placeholder="Name" style="flex: 2;">
                    <input type="number" id="member3Points" placeholder="Points" min="0" max="90" step="0.1" value="0" style="flex: 1;">
                </div>

                <div class="modal-actions">
                    <button type="button" class="modal-btn cancel" id="teamModalCancel">Cancel</button>
                    <button type="submit" class="modal-btn confirm" id="teamModalConfirm">Save Team</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="alertModal" role="alertdialog" aria-modal="true" aria-labelledby="alertTitle">
        <div class="modal-box">
            <h3 id="alertTitle">Notice</h3>
            <p id="alertMessage" style="margin: 20px 0;"></p>
            <div class="modal-actions">
                <button class="modal-btn confirm" id="alertOkBtn">OK</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="confirmModal" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
        <div class="modal-box">
            <h3 id="confirmTitle">Confirm</h3>
            <p id="confirmMessage" style="margin: 20px 0;"></p>
            <div class="modal-actions">
                <button class="modal-btn cancel" id="confirmNoBtn">Cancel</button>
                <button class="modal-btn confirm" id="confirmYesBtn">Yes</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="selectTeamModal" role="dialog" aria-modal="true" aria-labelledby="selectTeamTitle">
        <div class="modal-box">
            <h3 id="selectTeamTitle">Select Team</h3>
            <p id="selectTeamMessage" style="margin: 10px 0;"></p>
            <select id="teamSelect" style="width: 100%; margin: 15px 0;"></select>
            <div class="modal-actions">
                <button class="modal-btn cancel" id="selectTeamCancelBtn">Cancel</button>
                <button class="modal-btn confirm" id="selectTeamConfirmBtn">Select</button>
            </div>
        </div>
    </div>

    <script>
        // Data (identical to original)
        let speakers = [];
        let teams = [];
        let roundAssignments = { prelim1:[], prelim2:[], prelim3:[], octa:[], quarter:[], semi:[], final:[] };

        function loadData() {
            try {
                const savedSpeakers = localStorage.getItem('idbate_speakers');
                if (savedSpeakers) speakers = JSON.parse(savedSpeakers);
                const savedTeams = localStorage.getItem('idbate_teams');
                if (savedTeams) teams = JSON.parse(savedTeams);
                const savedRounds = localStorage.getItem('idbate_rounds');
                if (savedRounds) roundAssignments = JSON.parse(savedRounds);
            } catch (e) {}
        }
        loadData();

        function saveSpeakers() { localStorage.setItem('idbate_speakers', JSON.stringify(speakers)); }
        function saveTeams() { localStorage.setItem('idbate_teams', JSON.stringify(teams)); }
        function saveRounds() { localStorage.setItem('idbate_rounds', JSON.stringify(roundAssignments)); }

        // Modal helpers
        function showAlert(message, title = 'Notice') {
            document.getElementById('alertTitle').textContent = title;
            document.getElementById('alertMessage').textContent = message;
            document.getElementById('alertModal').classList.add('active');
        }
        function hideAlert() { document.getElementById('alertModal').classList.remove('active'); }
        function showConfirm(message, title = 'Confirm') {
            return new Promise(resolve => {
                document.getElementById('confirmTitle').textContent = title;
                document.getElementById('confirmMessage').textContent = message;
                document.getElementById('confirmModal').classList.add('active');
                const yesHandler = () => {
                    document.getElementById('confirmModal').classList.remove('active');
                    document.getElementById('confirmYesBtn').removeEventListener('click', yesHandler);
                    document.getElementById('confirmNoBtn').removeEventListener('click', noHandler);
                    resolve(true);
                };
                const noHandler = () => {
                    document.getElementById('confirmModal').classList.remove('active');
                    document.getElementById('confirmYesBtn').removeEventListener('click', yesHandler);
                    document.getElementById('confirmNoBtn').removeEventListener('click', noHandler);
                    resolve(false);
                };
                document.getElementById('confirmYesBtn').addEventListener('click', yesHandler);
                document.getElementById('confirmNoBtn').addEventListener('click', noHandler);
            });
        }
        function showTeamSelect(options, message, title) {
            return new Promise(resolve => {
                document.getElementById('selectTeamTitle').textContent = title;
                document.getElementById('selectTeamMessage').textContent = message;
                const select = document.getElementById('teamSelect');
                select.innerHTML = '';
                options.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt.value;
                    option.textContent = opt.label;
                    select.appendChild(option);
                });
                document.getElementById('selectTeamModal').classList.add('active');
                const confirmHandler = () => {
                    const value = select.value;
                    document.getElementById('selectTeamModal').classList.remove('active');
                    document.getElementById('selectTeamConfirmBtn').removeEventListener('click', confirmHandler);
                    document.getElementById('selectTeamCancelBtn').removeEventListener('click', cancelHandler);
                    resolve(value);
                };
                const cancelHandler = () => {
                    document.getElementById('selectTeamModal').classList.remove('active');
                    document.getElementById('selectTeamConfirmBtn').removeEventListener('click', confirmHandler);
                    document.getElementById('selectTeamCancelBtn').removeEventListener('click', cancelHandler);
                    resolve(null);
                };
                document.getElementById('selectTeamConfirmBtn').addEventListener('click', confirmHandler);
                document.getElementById('selectTeamCancelBtn').addEventListener('click', cancelHandler);
            });
        }
        document.getElementById('alertOkBtn').addEventListener('click', hideAlert);

        function escapeHtml(unsafe) {
            return unsafe.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
        }

        // Renderers (identical output, only grouping changed)
        function renderSidebarStats() {
            const total = speakers.length, totalPoints = speakers.reduce((s,p)=>s+p.points,0), avg = total?(totalPoints/total).toFixed(1):0, max = speakers.length?Math.max(...speakers.map(s=>s.points)):0;
            document.getElementById('sidebarStats').innerHTML = `<div class="stat-row"><span class="stat-label">Speakers</span><span class="stat-value">${total}</span></div><div class="stat-row"><span class="stat-label">Total pts</span><span class="stat-value">${totalPoints.toFixed(1)}</span></div><div class="stat-row"><span class="stat-label">Average</span><span class="stat-value">${avg}</span></div><div class="stat-row"><span class="stat-label">Highest</span><span class="stat-value">${max.toFixed(1)}</span></div>`;
        }
        function renderMiniPodium() {
            const sorted = [...speakers].sort((a,b)=>b.points-a.points).slice(0,3), container = document.getElementById('miniPodium');
            if (!sorted.length) { container.innerHTML = '<h4><i class="fa-solid fa-crown" aria-hidden="true"></i> Top 3</h4><p style="color:#aaa;">No speakers</p>'; return; }
            container.innerHTML = '<h4><i class="fa-solid fa-crown" aria-hidden="true"></i> Top 3</h4>'+sorted.map((s,i)=>`<div class="podium-mini-item"><span class="rank">#${i+1}</span><span class="name">${escapeHtml(s.name)}</span><span class="points">${s.points.toFixed(1)}</span></div>`).join('');
        }
        function renderTeams() {
            const container = document.getElementById('teamsContainer');
            if (!teams.length) { container.innerHTML = '<p style="color:#aaa; text-align:center;">No teams yet. Click + to add.</p>'; return; }
            container.innerHTML = teams.map(t=>{ const m=t.members||[]; let slots=''; for(let i=0;i<3;i++){ if(i<m.length) slots+=`<div class="member-slot"><span class="slot-number">#${i+1}</span><span class="name">${escapeHtml(m[i].name)}</span><span class="points">${m[i].points.toFixed(1)}</span><button class="edit-slot" onclick="editTeam('${t.id}')" aria-label="edit team member"><i class="fa-regular fa-pen-to-square" aria-hidden="true"></i></button></div>`; else slots+=`<div class="member-slot" style="opacity:0.6;"><span class="slot-number">#${i+1}</span><span class="name">— empty —</span><span class="points">—</span><button class="edit-slot" onclick="editTeam('${t.id}')" aria-label="add member"><i class="fa-regular fa-plus" aria-hidden="true"></i></button></div>`; } return `<div class="team-card"><div class="team-header"><span class="team-name">${escapeHtml(t.name)}</span><div class="team-actions"><button onclick="editTeam('${t.id}')" aria-label="edit team"><i class="fa-regular fa-pen-to-square" aria-hidden="true"></i></button><button onclick="deleteTeam('${t.id}')" aria-label="delete team"><i class="fa-regular fa-trash-can" aria-hidden="true"></i></button></div></div><div class="team-members">${slots}</div></div>`; }).join('');
        }
        function renderTop3() {
            const sorted = [...speakers].sort((a,b)=>b.points-a.points).slice(0,3), grid = document.getElementById('top3Grid');
            if (!sorted.length) { grid.innerHTML = '<p>No speakers</p>'; return; }
            grid.innerHTML = sorted.map((s,i)=>`<div class="podium-item ${i===0?'first':''}"><div class="podium-rank">#${i+1}</div><div class="podium-name">${escapeHtml(s.name)}</div><div class="podium-points">${s.points.toFixed(1)} pts</div></div>`).join('');
        }
        function renderTop10() {
            const sorted = [...speakers].sort((a,b)=>b.points-a.points).slice(0,10), grid = document.getElementById('top10Grid');
            if (!sorted.length) { grid.innerHTML = '<p>No speakers</p>'; return; }
            grid.innerHTML = sorted.map((s,i)=>`<div class="top10-item"><span class="top10-rank">#${i+1}</span><span class="top10-name">${escapeHtml(s.name)}</span><span class="top10-points">${s.points.toFixed(1)}</span></div>`).join('');
        }
        function renderFullTable() {
            const sorted = [...speakers].sort((a,b)=>b.points-a.points), container = document.getElementById('tableContainer');
            if (!sorted.length) { container.innerHTML = '<div style="text-align:center; padding:40px; color:#94a3b8;"><i class="fa-regular fa-face-smile"></i> No speakers yet. Add one above!</div>'; return; }
            container.innerHTML = `<table><thead><tr><th>Rank</th><th>Speaker</th><th>Points</th><th>Actions</th></tr></thead><tbody>${sorted.map((s,i)=>`<tr><td class="rank-cell">#${i+1}</td><td>${escapeHtml(s.name)}</td><td>${s.points.toFixed(1)}</td><td><div class="actions"><button class="edit-btn" onclick="editSpeaker('${s.id}')" aria-label="edit speaker"><i class="fa-regular fa-pen-to-square"></i></button><button class="delete-btn" onclick="deleteSpeaker('${s.id}')" aria-label="delete speaker"><i class="fa-regular fa-trash-can"></i></button></div></td></tr>`).join('')}</tbody></table>`;
        }

        // ROUNDS with accessible grouping (Preliminary + Knockout)
        function renderRounds() {
            const container = document.getElementById('bracketContainer');
            const prelimRounds = [
                { key:'prelim1', sub:'Round one' },
                { key:'prelim2', sub:'Round two' },
                { key:'prelim3', sub:'Round three' }
            ];
            const knockout = [
                { key:'octa', name:'Octa‑final' },
                { key:'quarter', name:'Quarter‑final' },
                { key:'semi', name:'Semi‑final' },
                { key:'final', name:'Final' }
            ];

            let html = '';

            // Preliminary group
            html += `<section class="round-group" aria-labelledby="prelim-heading">`;
            html += `<h3 class="group-title" id="prelim-heading"><i class="fa-regular fa-calendar-circle-plus" aria-hidden="true"></i> Preliminary round</h3>`;
            html += `<div class="round-grid">`;
            prelimRounds.forEach(p => {
                const assigned = (roundAssignments[p.key]||[]).map(id=>teams.find(t=>t.id===id)).filter(t=>t);
                html += `<div class="round-card">`;
                html += `<div class="round-header"><h4>${p.sub}</h4><button onclick="addTeamToRound('${p.key}')" aria-label="Add team to ${p.sub}"><i class="fa-solid fa-plus-circle" aria-hidden="true"></i></button></div>`;
                html += `<ul class="round-teams">`;
                if (!assigned.length) html += `<li style="color:#94a3b8; text-align:center;">— empty —</li>`;
                else assigned.forEach(t => html += `<li><div class="team-summary"><span class="team-name">${escapeHtml(t.name)}</span><button onclick="removeTeamFromRound('${p.key}', '${t.id}')" aria-label="Remove ${t.name}"><i class="fa-regular fa-trash-can" aria-hidden="true"></i></button></div><div class="team-members-preview">${t.members.map(m=>`<span class="member-tag">${escapeHtml(m.name)} (${m.points.toFixed(1)})</span>`).join('')}</div></li>`);
                html += `</ul></div>`;
            });
            html += `</div></section>`;

            // Knockout group (no extra heading, keep original style but wrap for consistency)
            html += `<section class="round-group" aria-labelledby="knockout-heading">`;
            html += `<h3 class="group-title" id="knockout-heading"><i class="fa-regular fa-trophy" aria-hidden="true"></i> Knockout rounds</h3>`;
            html += `<div class="round-grid">`;
            knockout.forEach(r => {
                const assigned = (roundAssignments[r.key]||[]).map(id=>teams.find(t=>t.id===id)).filter(t=>t);
                html += `<div class="round-card">`;
                html += `<div class="round-header"><h4>${r.name}</h4><button onclick="addTeamToRound('${r.key}')" aria-label="Add team to ${r.name}"><i class="fa-solid fa-plus-circle" aria-hidden="true"></i></button></div>`;
                html += `<ul class="round-teams">`;
                if (!assigned.length) html += `<li style="color:#94a3b8; text-align:center;">— empty —</li>`;
                else assigned.forEach(t => html += `<li><div class="team-summary"><span class="team-name">${escapeHtml(t.name)}</span><button onclick="removeTeamFromRound('${r.key}', '${t.id}')" aria-label="Remove ${t.name}"><i class="fa-regular fa-trash-can" aria-hidden="true"></i></button></div><div class="team-members-preview">${t.members.map(m=>`<span class="member-tag">${escapeHtml(m.name)} (${m.points.toFixed(1)})</span>`).join('')}</div></li>`);
                html += `</ul></div>`;
            });
            html += `</div></section>`;

            container.innerHTML = html;
        }

        function renderAll() { renderSidebarStats(); renderMiniPodium(); renderTeams(); renderTop3(); renderTop10(); renderFullTable(); renderRounds(); }

        // Speaker/team functions (original)
        window.editSpeaker = function(id) { const s=speakers.find(s=>s.id===id); if(s){ document.getElementById('speakerName').value=s.name; document.getElementById('speakerPoints').value=s.points; } };
        window.deleteSpeaker = async function(id) { if(await showConfirm('Delete this speaker?')){ speakers=speakers.filter(s=>s.id!==id); saveSpeakers(); renderAll(); } };
        let currentTeamId = null;
        window.editTeam = function(id) { const t=teams.find(t=>t.id===id); if(t){ currentTeamId=id; document.getElementById('teamModalTitle').textContent='Edit Team'; document.getElementById('teamNameInput').value=t.name||''; const m=t.members||[]; document.getElementById('member1Name').value=m[0]?.name||''; document.getElementById('member1Points').value=m[0]?.points||0; document.getElementById('member2Name').value=m[1]?.name||''; document.getElementById('member2Points').value=m[1]?.points||0; document.getElementById('member3Name').value=m[2]?.name||''; document.getElementById('member3Points').value=m[2]?.points||0; document.getElementById('teamModal').classList.add('active'); } };
        window.deleteTeam = async function(id) { if(await showConfirm('Delete this team?')){ for(let r in roundAssignments) roundAssignments[r]=roundAssignments[r].filter(tid=>tid!==id); teams=teams.filter(t=>t.id!==id); saveTeams(); saveRounds(); renderAll(); } };
        window.addTeamToRound = async function(roundKey) {
            if(teams.length===0){ showAlert('No teams available. Create teams first.'); return; }
            const options=teams.map(t=>({value:t.id, label:`${t.name} (${t.members.length} members)`}));
            const selectedId = await showTeamSelect(options,'Select a team to add:',`Add to ${roundKey}`);
            if(selectedId && !roundAssignments[roundKey].includes(selectedId)){ roundAssignments[roundKey].push(selectedId); saveRounds(); renderRounds(); }
        };
        window.removeTeamFromRound = async function(roundKey, teamId) { if(await showConfirm('Remove this team from the round?')){ roundAssignments[roundKey]=roundAssignments[roundKey].filter(id=>id!==teamId); saveRounds(); renderRounds(); } };

        // Event listeners
        document.getElementById('addTeamBtn').addEventListener('click', ()=>{ currentTeamId=null; document.getElementById('teamModalTitle').textContent='Add New Team'; ['teamNameInput','member1Name','member2Name','member3Name'].forEach(id=>document.getElementById(id).value=''); [1,2,3].forEach(i=>document.getElementById(`member${i}Points`).value=0); document.getElementById('teamModal').classList.add('active'); });
        document.getElementById('teamModalCancel').addEventListener('click', ()=>document.getElementById('teamModal').classList.remove('active'));
        document.getElementById('teamForm').addEventListener('submit', (e)=>{ e.preventDefault(); const teamName=document.getElementById('teamNameInput').value.trim(); if(!teamName){ showAlert('Team name is required'); return; } const members=[]; for(let i=1;i<=3;i++){ const inpName=document.getElementById(`member${i}Name`), inpPts=document.getElementById(`member${i}Points`); if(inpName.value.trim()){ const pts=parseFloat(inpPts.value)||0; if(pts<0||pts>90){ showAlert(`Points for member ${i} must be 0-90`); return; } members.push({name:inpName.value.trim(), points:pts}); } } if(currentTeamId){ const team=teams.find(t=>t.id===currentTeamId); if(team){ team.name=teamName; team.members=members; } } else { teams.push({id:Date.now()+'-'+Math.random().toString(36).substr(2,6), name:teamName, members:members}); } saveTeams(); renderAll(); document.getElementById('teamModal').classList.remove('active'); });
        document.getElementById('addBtn').addEventListener('click', ()=>{ const name=document.getElementById('speakerName').value.trim(); const pts=parseFloat(document.getElementById('speakerPoints').value); if(!name){ showAlert('Please enter a speaker name'); return; } if(isNaN(pts)||pts<0||pts>90){ showAlert('Points must be between 0 and 90'); return; } const idx=speakers.findIndex(s=>s.name.toLowerCase()===name.toLowerCase()); if(idx!==-1) speakers[idx].points=pts; else speakers.push({id:Date.now()+'-'+Math.random().toString(36).substr(2,6), name:name, points:pts}); saveSpeakers(); renderAll(); document.getElementById('speakerName').value=''; document.getElementById('speakerPoints').value=0; });
        document.getElementById('resetBtn').addEventListener('click', async ()=>{ if(await showConfirm('Delete all speakers?')){ speakers=[]; saveSpeakers(); renderAll(); } });

        // Tab panel visibility
        const tabR = document.getElementById('tabRankings'), tabP = document.getElementById('tabProgress'), viewR = document.getElementById('rankingsView'), viewP = document.getElementById('progressView');
        tabR.addEventListener('click', ()=>{ tabR.setAttribute('aria-selected','true'); tabP.setAttribute('aria-selected','false'); viewR.hidden=false; viewP.hidden=true; tabR.classList.add('active'); tabP.classList.remove('active'); });
        tabP.addEventListener('click', ()=>{ tabP.setAttribute('aria-selected','true'); tabR.setAttribute('aria-selected','false'); viewP.hidden=false; viewR.hidden=true; tabP.classList.add('active'); tabR.classList.remove('active'); renderRounds(); });

        // Sidebar toggle with a11y
        const sidebar = document.getElementById('sidebar'), toggleBtn = document.getElementById('toggleSidebar'), toggleIcon = document.getElementById('toggleIcon');
        toggleBtn.addEventListener('click', ()=>{ const isCollapsed = sidebar.classList.toggle('collapsed'); toggleBtn.setAttribute('aria-expanded', !isCollapsed); if(isCollapsed){ toggleIcon.classList.remove('fa-chevron-left'); toggleIcon.classList.add('fa-chevron-right'); } else { toggleIcon.classList.remove('fa-chevron-right'); toggleIcon.classList.add('fa-chevron-left'); } });
        toggleBtn.addEventListener('keydown', (e)=>{ if(e.key==='Enter'||e.key===' ') { e.preventDefault(); toggleBtn.click(); } });

        document.getElementById('speakerName').addEventListener('keypress', e=>{if(e.key==='Enter') document.getElementById('addBtn').click();});
        document.getElementById('speakerPoints').addEventListener('keypress', e=>{if(e.key==='Enter') document.getElementById('addBtn').click();});

        renderAll();
        // ensure initial panel visibility
        viewP.hidden = true; viewR.hidden = false;
    </script>
</body>
</html>
