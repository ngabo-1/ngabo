<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDBATE · three‑member teams</title>
    <base href="/">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="canonical" href="https://idbate.com">
    <meta property="og:title" content="IDBATE Competition Hub">
    <meta property="og:description" content="Three‑member teams, full control">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://idbate.com">
    <style>
        /* (styles unchanged – same as previous) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 1.5rem;
        }

        .app-container {
            display: flex;
            max-width: 1400px;
            width: 100%;
            gap: 1.5rem;
            transition: all 0.3s ease;
        }

        /* ---------- SIDEBAR (deep gray + orange) ---------- */
        .sidebar {
            flex: 0 0 320px;
            background: #1e1e2e;
            border-radius: 32px;
            padding: 2rem 1.5rem;
            color: #e0e0e0;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            height: fit-content;
            transition: all 0.3s ease;
            position: relative;
        }

        .sidebar.collapsed {
            flex: 0 0 80px;
            padding: 2rem 1rem;
            overflow: hidden;
        }

        .sidebar.collapsed h2 span,
        .sidebar.collapsed .podium-mini,
        .sidebar.collapsed .stat-card-side,
        .sidebar.collapsed .teams-section {
            display: none;
        }

        .sidebar .toggle-btn {
            position: absolute;
            top: 20px;
            right: -12px;
            background: #f57c00;
            color: #1e1e2e;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid #1e1e2e;
            z-index: 10;
            transition: 0.2s;
        }

        .sidebar .toggle-btn:hover {
            background: #ff9500;
        }

        .sidebar h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #f57c00;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sidebar h2 i {
            font-size: 2rem;
        }

        /* Dashboard mini podium */
        .podium-mini {
            background: #2d2d3a;
            border-radius: 24px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            border-left: 6px solid #f57c00;
        }
        .podium-mini h4 {
            color: #f57c00;
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .podium-mini-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e2e;
            border-radius: 40px;
            padding: 0.5rem 1rem;
            margin-bottom: 0.5rem;
        }
        .podium-mini-item .rank {
            font-weight: 800;
            color: #f57c00;
            width: 2rem;
        }
        .podium-mini-item .name {
            flex: 1;
            font-weight: 500;
        }
        .podium-mini-item .points {
            background: #f57c00;
            color: #1e1e2e;
            font-weight: 700;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.8rem;
        }

        .stat-card-side {
            background: #2d2d3a;
            border-radius: 24px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            border-left: 6px solid #f57c00;
        }

        .stat-side-value {
            font-size: 2rem;
            font-weight: 800;
            color: white;
        }

        .stat-side-label {
            color: #f57c00;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.03em;
        }

        .teams-section {
            margin-top: 2rem;
        }

        .teams-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .teams-header h3 {
            color: #f57c00;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .add-team-btn {
            background: #f57c00;
            color: #1e1e2e;
            border: none;
            border-radius: 30px;
            width: 36px;
            height: 36px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 700;
            transition: 0.2s;
        }

        .add-team-btn:hover {
            background: #ff9500;
        }

        /* Team cards with three fixed slots */
        .team-card {
            background: #2d2d3a;
            border-radius: 28px;
            padding: 1.2rem;
            margin-bottom: 1.2rem;
            border: 2px solid transparent;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            transition: 0.2s;
        }
        .team-card:hover {
            border-color: #f57c00;
        }

        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .team-name {
            font-weight: 700;
            color: white;
            font-size: 1.3rem;
            background: #1e1e2e;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            border-left: 4px solid #f57c00;
        }

        .team-actions button {
            background: none;
            border: none;
            color: #f57c00;
            font-size: 1.2rem;
            margin-left: 0.5rem;
            cursor: pointer;
        }

        .team-members {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        /* Three fixed slots */
        .member-slot {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #1e1e2e;
            border-radius: 40px;
            padding: 0.5rem 1rem;
            border: 1px solid #40405c;
        }
        .member-slot .slot-number {
            color: #f57c00;
            font-weight: 700;
            min-width: 2rem;
            font-size: 0.9rem;
        }
        .member-slot .name {
            flex: 2;
            font-weight: 500;
            color: #e0e0e0;
        }
        .member-slot .points {
            background: #f57c00;
            color: #1e1e2e;
            font-weight: 700;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.85rem;
            min-width: 4rem;
            text-align: center;
        }
        .member-slot .edit-slot {
            background: none;
            border: none;
            color: #f57c00;
            font-size: 1rem;
            cursor: pointer;
        }

        /* ---------- MAIN CONTENT ---------- */
        .main-content {
            flex: 1;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            padding: 2rem;
        }

        .main-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1e1e2e;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .main-header h1 i {
            color: #f57c00;
            font-size: 2.5rem;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 1.5rem;
            font-size: 1rem;
            border-left: 4px solid #f57c00;
            padding-left: 1rem;
        }

        .tab-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5rem;
        }
        .tab {
            padding: 0.6rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            background: #f1f5f9;
            color: #475569;
        }
        .tab.active {
            background: #f57c00;
            color: #1e1e2e;
        }

        .rankings-view { display: block; }
        .progress-view { display: none; }

        .input-section {
            background: #f8fafc;
            border-radius: 24px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: flex-end;
        }

        .input-field {
            flex: 2 1 200px;
        }

        .input-field label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #475569;
            margin-bottom: 0.3rem;
        }

        .input-field input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 2px solid #e2e8f0;
            border-radius: 40px;
            font-size: 1rem;
            background: white;
        }

        .input-field input:focus {
            outline: none;
            border-color: #f57c00;
            box-shadow: 0 0 0 3px rgba(245,158,11,0.2);
        }

        .points-field { flex: 1 1 120px; }

        .add-btn {
            flex: 0 0 auto;
            background: #f57c00;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 0.9rem 2rem;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(245,158,11,0.3);
            height: 54px;
            white-space: nowrap;
        }

        .add-btn:hover { background: #e07c00; }

        .info-note {
            font-size:0.85rem; color:#64748b; margin-top:0.75rem;
        }
        .info-note i { color: #f57c00; }

        .top3-section, .top10-section {
            background: #f8fafc;
            border-radius: 32px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }

        .top3-header, .top10-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
        }
        .top3-header h3, .top10-header h3 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e1e2e;
        }

        .top3-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .podium-item {
            background: white;
            border-radius: 30px;
            padding: 1.2rem;
            text-align: center;
            border: 2px solid #e2e8f0;
        }
        .podium-item.first { border-color: #f57c00; background: #fff7ed; }
        .podium-rank { font-size: 2rem; font-weight: 800; color: #f57c00; }
        .podium-name { font-weight: 700; font-size: 1.2rem; }
        .podium-points { font-weight: 600; color: #64748b; }

        .top10-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.8rem;
        }
        .top10-item {
            background: white;
            border-radius: 40px;
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            border: 1px solid #e2e8f0;
        }
        .top10-rank { font-weight: 800; color: #f57c00; min-width: 2rem; }
        .top10-name { flex: 1; font-weight: 600; }
        .top10-points {
            background: #f1f5f9;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            font-weight: 700;
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .leaderboard-header h2 { font-size: 1.5rem; font-weight: 700; color: #1e1e2e; }
        .reset-btn {
            background: none;
            border: 2px solid #e2e8f0;
            color: #64748b;
            border-radius: 40px;
            padding: 0.5rem 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .reset-btn:hover { border-color: #f57c00; color: #f57c00; background: #fff7ed; }

        .table-container {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #edf2f7;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }
        th {
            background: #f8fafc;
            color: #334155;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 1rem;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
        }
        td {
            padding: 1rem;
            border-bottom: 1px solid #edf2f7;
        }
        .rank { font-weight: 800; color: #f57c00; }
        .actions { display: flex; gap: 0.8rem; }
        .edit-btn, .delete-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .edit-btn { color: #3b82f6; }
        .delete-btn { color: #ef4444; }

        /* Round cards (now for teams) */
        .bracket-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .round-card {
            background: #f8fafc;
            border-radius: 24px;
            padding: 1.2rem;
            width: calc(33.33% - 1rem);
            min-width: 250px;
            border: 2px solid #e2e8f0;
        }
        .round-card h4 {
            color: #f57c00;
            font-weight: 700;
            margin-bottom: 1rem;
            text-align: center;
            border-bottom: 2px dashed #f57c00;
            padding-bottom: 0.3rem;
            display: flex;
            justify-content: space-between;
        }
        .round-card h4 button {
            background: none;
            border: none;
            color: #f57c00;
            font-size: 1.2rem;
            cursor: pointer;
        }
        .round-teams {
            list-style: none;
        }
        .round-teams li {
            background: white;
            border-radius: 40px;
            padding: 0.7rem 1rem;
            margin-bottom: 0.6rem;
            border: 1px solid #e2e8f0;
        }
        .team-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }
        .team-summary .team-name {
            color: #1e1e2e;
        }
        .team-members-preview {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 0.2rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .member-preview {
            background: #f1f5f9;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
        }
        .remove-team-btn {
            background: none;
            border: none;
            color: #ef4444;
            font-size: 1rem;
            cursor: pointer;
            margin-left: 0.5rem;
        }

        .url-bar {
            background: #f1f5f9;
            border-radius: 40px;
            padding: 0.4rem 1rem;
            margin-bottom: 1rem;
            display: inline-block;
            font-size: 0.85rem;
            color: #475569;
            border: 1px solid #e2e8f0;
        }

        /* Team modal with three slots */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(3px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-box {
            background: #1e1e2e;
            border-radius: 32px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border: 2px solid #f57c00;
            color: #e0e0e0;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-box h3 {
            color: #f57c00;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }
        .modal-box label {
            display: block;
            margin-top: 1rem;
            margin-bottom: 0.3rem;
            font-weight: 600;
            color: #f57c00;
        }
        .modal-box input {
            width: 100%;
            padding: 0.8rem 1.2rem;
            background: #2d2d3a;
            border: 2px solid #40405c;
            border-radius: 40px;
            color: white;
            font-size: 1rem;
        }
        .modal-box input:focus {
            outline: none;
            border-color: #f57c00;
        }
        .modal-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.8rem;
            align-items: center;
        }
        .modal-row .member-name {
            flex: 3;
        }
        .modal-row .member-points {
            flex: 1;
        }
        .modal-actions {
            display: flex;
            gap: 0.8rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }
        .modal-btn {
            padding: 0.7rem 1.5rem;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        .modal-btn.confirm {
            background: #f57c00;
            color: #1e1e2e;
        }
        .modal-btn.cancel {
            background: #2d2d3a;
            color: #e0e0e0;
            border: 1px solid #40405c;
        }

        @media (max-width: 1000px) {
            .app-container { flex-direction: column; }
            .sidebar { max-width: 100%; }
            .round-card { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="toggle-btn" id="toggleSidebar">
                <i class="fa-solid fa-chevron-left" id="toggleIcon"></i>
            </div>
            <h2><i class="fa-regular fa-chart-bar"></i> <span>DASHBOARD</span></h2>

            <div class="podium-mini" id="miniPodium"></div>
            <div class="stat-card-side" id="sidebarStats"></div>

            <div class="teams-section">
                <div class="teams-header">
                    <h3><i class="fa-regular fa-users"></i> <span>TEAMS (max 3)</span></h3>
                    <button class="add-team-btn" id="addTeamBtn" title="Add new team"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div id="teamsContainer"></div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <div class="url-bar">
                <i class="fa-regular fa-link"></i> https://idbate.com | Three‑member teams
            </div>

            <div class="main-header">
                <h1><i class="fa-regular fa-microphone"></i> IDBATE COMPETITION</h1>
                <div class="subtitle">Add speakers, form teams (max 3 members), and assign teams to rounds</div>
            </div>

            <div class="tab-bar">
                <div class="tab active" id="tabRankings">🏆 Speakers</div>
                <div class="tab" id="tabProgress">📊 Round Assignments (Teams)</div>
            </div>

            <!-- RANKINGS VIEW (speakers) -->
            <div class="rankings-view" id="rankingsView">
                <div class="input-section">
                    <div class="input-row">
                        <div class="input-field">
                            <label>Speaker name</label>
                            <input type="text" id="speakerName" placeholder="e.g., Jane Doe">
                        </div>
                        <div class="input-field points-field">
                            <label>Points (≤90)</label>
                            <input type="number" id="speakerPoints" placeholder="0" min="0" max="90" step="0.1" value="0">
                        </div>
                        <button class="add-btn" id="addBtn"><i class="fa-solid fa-plus"></i> Add / Update</button>
                    </div>
                </div>

                <div class="top3-section">
                    <div class="top3-header"><i class="fa-solid fa-crown" style="color:#f57c00;"></i><h3>Top 3 speakers</h3></div>
                    <div class="top3-grid" id="top3Grid"></div>
                </div>

                <div class="top10-section">
                    <div class="top10-header"><i class="fa-solid fa-trophy"></i><h3>Top 10 speakers</h3></div>
                    <div class="top10-grid" id="top10Grid"></div>
                </div>

                <div class="leaderboard-header">
                    <h2><i class="fa-regular fa-list"></i> All speakers</h2>
                    <button class="reset-btn" id="resetBtn"><i class="fa-regular fa-trash-can"></i> Reset all</button>
                </div>
                <div class="table-container" id="tableContainer"></div>
            </div>

            <!-- PROGRESS VIEW (teams in rounds) -->
            <div class="progress-view" id="progressView">
                <h2 style="margin-bottom:1.5rem;"><i class="fa-regular fa-diagram-project"></i> Assign teams to rounds</h2>
                <div class="bracket-container" id="bracketContainer"></div>
            </div>
        </main>
    </div>

    <!-- TEAM MODAL (three fixed slots) -->
    <div class="modal-overlay" id="teamModal">
        <div class="modal-box">
            <h3 id="teamModalTitle">Add Team</h3>
            <form id="teamForm">
                <label>Team Name</label>
                <input type="text" id="teamNameInput" placeholder="e.g., Team Phoenix" required>

                <label style="margin-top:1.5rem;">Member 1 (optional)</label>
                <div class="modal-row">
                    <input type="text" id="member1Name" class="member-name" placeholder="Name">
                    <input type="number" id="member1Points" class="member-points" placeholder="Points" min="0" max="90" step="0.1" value="0">
                </div>

                <label>Member 2 (optional)</label>
                <div class="modal-row">
                    <input type="text" id="member2Name" class="member-name" placeholder="Name">
                    <input type="number" id="member2Points" class="member-points" placeholder="Points" min="0" max="90" step="0.1" value="0">
                </div>

                <label>Member 3 (optional)</label>
                <div class="modal-row">
                    <input type="text" id="member3Name" class="member-name" placeholder="Name">
                    <input type="number" id="member3Points" class="member-points" placeholder="Points" min="0" max="90" step="0.1" value="0">
                </div>

                <div class="modal-actions">
                    <button type="button" class="modal-btn cancel" id="teamModalCancel">Cancel</button>
                    <button type="submit" class="modal-btn confirm" id="teamModalConfirm">Save Team</button>
                </div>
            </form>
        </div>
    </div>

    <!-- GENERIC MODAL (for alerts/selects) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox">
            <h3 id="modalTitle">Title</h3>
            <p id="modalMessage">Message</p>
            <select id="modalSelect" style="display: none;"></select>
            <input type="text" id="modalInput" placeholder="Enter value" style="display: none;">
            <div class="modal-actions">
                <button class="modal-btn cancel" id="modalCancel">Cancel</button>
                <button class="modal-btn confirm" id="modalConfirm">OK</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- CUSTOM MODAL (generic, for alerts/selects) ----------
            const overlay = document.getElementById('modalOverlay');
            const modalInput = document.getElementById('modalInput');
            const modalSelect = document.getElementById('modalSelect');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalCancel = document.getElementById('modalCancel');
            const modalConfirm = document.getElementById('modalConfirm');

            function hideModal() {
                overlay.style.display = 'none';
                modalInput.style.display = 'none';
                modalSelect.style.display = 'none';
                modalInput.value = '';
                modalSelect.innerHTML = '';
            }

            window.modalAlert = function(message, title='Notice') {
                return new Promise(resolve => {
                    modalTitle.innerText = title;
                    modalMessage.innerText = message;
                    modalInput.style.display = 'none';
                    modalSelect.style.display = 'none';
                    modalCancel.style.display = 'none';
                    modalConfirm.innerText = 'OK';
                    overlay.style.display = 'flex';
                    const onConfirm = () => { hideModal(); resolve(); };
                    modalConfirm.addEventListener('click', onConfirm, { once: true });
                });
            };

            window.modalConfirm = function(message, title='Confirm') {
                return new Promise(resolve => {
                    modalTitle.innerText = title;
                    modalMessage.innerText = message;
                    modalInput.style.display = 'none';
                    modalSelect.style.display = 'none';
                    modalCancel.style.display = 'inline-block';
                    modalConfirm.innerText = 'Yes';
                    modalCancel.innerText = 'Cancel';
                    overlay.style.display = 'flex';
                    const onConfirm = () => { hideModal(); resolve(true); };
                    const onCancel = () => { hideModal(); resolve(false); };
                    modalConfirm.addEventListener('click', onConfirm, { once: true });
                    modalCancel.addEventListener('click', onCancel, { once: true });
                });
            };

            window.modalPrompt = function(message, defaultValue='', title='Input') {
                return new Promise(resolve => {
                    modalTitle.innerText = title;
                    modalMessage.innerText = message;
                    modalInput.style.display = 'block';
                    modalSelect.style.display = 'none';
                    modalInput.value = defaultValue;
                    modalCancel.style.display = 'inline-block';
                    modalConfirm.innerText = 'Submit';
                    overlay.style.display = 'flex';
                    modalInput.focus();
                    const onConfirm = () => { const val = modalInput.value; hideModal(); resolve(val); };
                    const onCancel = () => { hideModal(); resolve(null); };
                    modalConfirm.addEventListener('click', onConfirm, { once: true });
                    modalCancel.addEventListener('click', onCancel, { once: true });
                    modalInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') onConfirm(); });
                });
            };

            window.modalSelectPrompt = function(message, options, title='Select') {
                return new Promise(resolve => {
                    modalTitle.innerText = title;
                    modalMessage.innerText = message;
                    modalInput.style.display = 'none';
                    modalSelect.style.display = 'block';
                    modalSelect.innerHTML = '';
                    options.forEach(opt => {
                        const option = document.createElement('option');
                        option.value = opt.value;
                        option.textContent = opt.label;
                        modalSelect.appendChild(option);
                    });
                    modalCancel.style.display = 'inline-block';
                    modalConfirm.innerText = 'Select';
                    overlay.style.display = 'flex';
                    const onConfirm = () => { const val = modalSelect.value; hideModal(); resolve(val); };
                    const onCancel = () => { hideModal(); resolve(null); };
                    modalConfirm.addEventListener('click', onConfirm, { once: true });
                    modalCancel.addEventListener('click', onCancel, { once: true });
                });
            };

            // ---------- STORAGE KEYS ----------
            const SPEAKERS_KEY = 'idbate_speakers';
            const TEAMS_KEY = 'idbate_teams';
            const ROUNDS_KEY = 'idbate_rounds';

            let speakers = [];
            let teams = [];
            // roundAssignments now stores arrays of TEAM IDs
            let roundAssignments = {
                prelim1: [], prelim2: [], prelim3: [],
                octa: [], quarter: [], semi: [], final: []
            };

            function loadData() {
                const storedSpeakers = localStorage.getItem(SPEAKERS_KEY);
                if (storedSpeakers) { try { speakers = JSON.parse(storedSpeakers); } catch(e){} }
                else { localStorage.setItem(SPEAKERS_KEY, JSON.stringify(speakers)); }

                const storedTeams = localStorage.getItem(TEAMS_KEY);
                if (storedTeams) { try { teams = JSON.parse(storedTeams); } catch(e){} }
                else { localStorage.setItem(TEAMS_KEY, JSON.stringify(teams)); }

                const storedRounds = localStorage.getItem(ROUNDS_KEY);
                if (storedRounds) { try { roundAssignments = JSON.parse(storedRounds); } catch(e){} }
                else { localStorage.setItem(ROUNDS_KEY, JSON.stringify(roundAssignments)); }
            }
            loadData();

            function saveSpeakers() { localStorage.setItem(SPEAKERS_KEY, JSON.stringify(speakers)); }
            function saveTeams() { localStorage.setItem(TEAMS_KEY, JSON.stringify(teams)); }
            function saveRounds() { localStorage.setItem(ROUNDS_KEY, JSON.stringify(roundAssignments)); }

            function escapeHtml(unsafe) {
                return unsafe.replace(/[&<>"]/g, m => {
                    if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; if (m === '"') return '&quot;'; return m;
                });
            }

            // ---------- RENDER MINI PODIUM ----------
            function renderMiniPodium() {
                const sorted = [...speakers].sort((a,b) => b.points - a.points);
                const top3 = sorted.slice(0,3);
                const container = document.getElementById('miniPodium');
                if (top3.length === 0) {
                    container.innerHTML = '<h4><i class="fa-solid fa-crown"></i> Top 3</h4><p style="color:#aaa;">No speakers</p>';
                    return;
                }
                let html = '<h4><i class="fa-solid fa-crown"></i> Top 3</h4>';
                top3.forEach((s, idx) => {
                    html += `<div class="podium-mini-item">
                        <span class="rank">#${idx+1}</span>
                        <span class="name">${escapeHtml(s.name)}</span>
                        <span class="points">${s.points.toFixed(1)}</span>
                    </div>`;
                });
                container.innerHTML = html;
            }

            // ---------- RENDER SIDEBAR STATS ----------
            function renderSidebarStats() {
                const total = speakers.length;
                const totalPoints = speakers.reduce((sum,s) => sum + s.points, 0);
                const avg = total ? (totalPoints/total).toFixed(1) : 0;
                const max = speakers.length ? Math.max(...speakers.map(s=>s.points)) : 0;
                const min = speakers.length ? Math.min(...speakers.map(s=>s.points)) : 0;
                document.getElementById('sidebarStats').innerHTML = `
                    <div style="margin-bottom:1rem;"><div class="stat-side-value">${total}</div><div class="stat-side-label">Speakers</div></div>
                    <div style="margin-bottom:1rem;"><div class="stat-side-value">${totalPoints.toFixed(1)}</div><div class="stat-side-label">Total pts</div></div>
                    <div style="margin-bottom:1rem;"><div class="stat-side-value">${avg}</div><div class="stat-side-label">Average</div></div>
                    <div style="margin-bottom:1rem;"><div class="stat-side-value">${max.toFixed(1)}</div><div class="stat-side-label">Highest</div></div>
                    <div><div class="stat-side-value">${min.toFixed(1)}</div><div class="stat-side-label">Lowest</div></div>
                `;
            }

            // ---------- TEAM MODAL (three slots) ----------
            const teamModal = document.getElementById('teamModal');
            const teamModalTitle = document.getElementById('teamModalTitle');
            const teamForm = document.getElementById('teamForm');
            const teamNameInput = document.getElementById('teamNameInput');
            const m1Name = document.getElementById('member1Name');
            const m1Points = document.getElementById('member1Points');
            const m2Name = document.getElementById('member2Name');
            const m2Points = document.getElementById('member2Points');
            const m3Name = document.getElementById('member3Name');
            const m3Points = document.getElementById('member3Points');
            const teamModalCancel = document.getElementById('teamModalCancel');

            let currentTeamId = null; // null for add, set for edit

            function hideTeamModal() {
                teamModal.style.display = 'none';
                teamForm.reset();
                currentTeamId = null;
            }

            function showTeamModal(title, teamData = null) {
                teamModalTitle.innerText = title;
                if (teamData) {
                    teamNameInput.value = teamData.name || '';
                    const members = teamData.members || [];
                    m1Name.value = members[0]?.name || '';
                    m1Points.value = members[0]?.points || 0;
                    m2Name.value = members[1]?.name || '';
                    m2Points.value = members[1]?.points || 0;
                    m3Name.value = members[2]?.name || '';
                    m3Points.value = members[2]?.points || 0;
                    currentTeamId = teamData.id;
                } else {
                    teamNameInput.value = '';
                    m1Name.value = ''; m1Points.value = 0;
                    m2Name.value = ''; m2Points.value = 0;
                    m3Name.value = ''; m3Points.value = 0;
                    currentTeamId = null;
                }
                teamModal.style.display = 'flex';
            }

            teamForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const teamName = teamNameInput.value.trim();
                if (!teamName) {
                    modalAlert('Team name is required', 'Missing');
                    return;
                }

                const members = [];
                if (m1Name.value.trim()) {
                    const pts = parseFloat(m1Points.value) || 0;
                    if (pts < 0 || pts > 90) { modalAlert('Points for member 1 must be 0‑90'); return; }
                    members.push({ name: m1Name.value.trim(), points: pts });
                }
                if (m2Name.value.trim()) {
                    const pts = parseFloat(m2Points.value) || 0;
                    if (pts < 0 || pts > 90) { modalAlert('Points for member 2 must be 0‑90'); return; }
                    members.push({ name: m2Name.value.trim(), points: pts });
                }
                if (m3Name.value.trim()) {
                    const pts = parseFloat(m3Points.value) || 0;
                    if (pts < 0 || pts > 90) { modalAlert('Points for member 3 must be 0‑90'); return; }
                    members.push({ name: m3Name.value.trim(), points: pts });
                }

                if (currentTeamId) {
                    const team = teams.find(t => t.id === currentTeamId);
                    if (team) {
                        team.name = teamName;
                        team.members = members;
                    }
                } else {
                    teams.push({
                        id: Date.now() + '-' + Math.random().toString(36).substr(2,5),
                        name: teamName,
                        members: members
                    });
                }
                saveTeams();
                renderTeams();
                hideTeamModal();
            });

            teamModalCancel.addEventListener('click', hideTeamModal);
            teamModal.addEventListener('click', (e) => { if (e.target === teamModal) hideTeamModal(); });

            // ---------- RENDER TEAMS (three fixed slots) ----------
            function renderTeams() {
                const container = document.getElementById('teamsContainer');
                if (teams.length === 0) {
                    container.innerHTML = '<p style="color:#aaa; text-align:center;">No teams yet. Click + to add.</p>';
                    return;
                }

                let html = '';
                teams.forEach(team => {
                    const members = team.members || [];
                    const slots = [];
                    for (let i = 0; i < 3; i++) {
                        slots.push(i < members.length ? members[i] : null);
                    }

                    html += `<div class="team-card">
                        <div class="team-header">
                            <span class="team-name">${escapeHtml(team.name)}</span>
                            <div class="team-actions">
                                <button onclick="editTeam('${team.id}')" title="Edit team"><i class="fa-regular fa-pen-to-square"></i></button>
                                <button onclick="deleteTeam('${team.id}')" title="Delete team"><i class="fa-regular fa-trash-can"></i></button>
                            </div>
                        </div>
                        <div class="team-members">`;

                    slots.forEach((member, idx) => {
                        if (member) {
                            html += `<div class="member-slot">
                                <span class="slot-number">#${idx+1}</span>
                                <span class="name">${escapeHtml(member.name)}</span>
                                <span class="points">${member.points.toFixed(1)}</span>
                                <button class="edit-slot" onclick="editTeam('${team.id}')" title="Edit member"><i class="fa-regular fa-pen-to-square"></i></button>
                            </div>`;
                        } else {
                            html += `<div class="member-slot" style="opacity:0.6;">
                                <span class="slot-number">#${idx+1}</span>
                                <span class="name">— empty —</span>
                                <span class="points">—</span>
                                <button class="edit-slot" onclick="editTeam('${team.id}')" title="Add member"><i class="fa-regular fa-plus"></i></button>
                            </div>`;
                        }
                    });

                    html += `</div></div>`;
                });
                container.innerHTML = html;
            }

            // Team actions
            window.editTeam = function(teamId) {
                const team = teams.find(t => t.id === teamId);
                if (team) showTeamModal('Edit Team', team);
            };

            window.deleteTeam = async function(teamId) {
                if (await modalConfirm('Delete this team?', 'Confirm')) {
                    // Remove team from all round assignments
                    for (let round in roundAssignments) {
                        roundAssignments[round] = roundAssignments[round].filter(id => id !== teamId);
                    }
                    teams = teams.filter(t => t.id !== teamId);
                    saveTeams();
                    saveRounds();
                    renderTeams();
                    renderProgress(); // update rounds view
                }
            };

            document.getElementById('addTeamBtn').addEventListener('click', () => {
                showTeamModal('Add New Team');
            });

            // ---------- RANKINGS VIEW (speakers) ----------
            function renderTop3() {
                const sorted = [...speakers].sort((a,b)=>b.points-a.points);
                const top3 = sorted.slice(0,3);
                const grid = document.getElementById('top3Grid');
                if (!top3.length) { grid.innerHTML = '<p style="color:#94a3b8;">No speakers</p>'; return; }
                grid.innerHTML = top3.map((s,idx) => {
                    let rankClass = idx===0 ? 'first' : '';
                    return `<div class="podium-item ${rankClass}">
                        <div class="podium-rank">#${idx+1}</div>
                        <div class="podium-name">${escapeHtml(s.name)}</div>
                        <div class="podium-points">${s.points.toFixed(1)} pts</div>
                    </div>`;
                }).join('');
            }

            function renderTop10() {
                const sorted = [...speakers].sort((a,b)=>b.points-a.points);
                const top10 = sorted.slice(0,10);
                const grid = document.getElementById('top10Grid');
                if (!top10.length) { grid.innerHTML = '<p style="color:#94a3b8;">No speakers</p>'; return; }
                grid.innerHTML = top10.map((s,idx) => `
                    <div class="top10-item">
                        <span class="top10-rank">#${idx+1}</span>
                        <span class="top10-name">${escapeHtml(s.name)}</span>
                        <span class="top10-points">${s.points.toFixed(1)}</span>
                    </div>
                `).join('');
            }

            function renderFullTable() {
                const sorted = [...speakers].sort((a,b)=>b.points-a.points);
                const container = document.getElementById('tableContainer');
                if (!sorted.length) {
                    container.innerHTML = '<div class="empty-state"><i class="fa-regular fa-face-smile"></i> No speakers yet. Add one above!</div>';
                    return;
                }
                let html = `<table><thead><tr><th>Rank</th><th>Speaker</th><th>Points</th><th>Actions</th></tr></thead><tbody>`;
                sorted.forEach((s, idx) => {
                    html += `<tr>
                        <td class="rank">#${idx+1}</td>
                        <td>${escapeHtml(s.name)}</td>
                        <td>${s.points.toFixed(1)}</td>
                        <td class="actions">
                            <button class="edit-btn" onclick="editSpeaker('${s.id}')"><i class="fa-regular fa-pen-to-square"></i></button>
                            <button class="delete-btn" onclick="deleteSpeaker('${s.id}')"><i class="fa-regular fa-trash-can"></i></button>
                        </td>
                    </tr>`;
                });
                html += '</tbody></table>';
                container.innerHTML = html;
            }

            window.editSpeaker = function(id) {
                const sp = speakers.find(s=>s.id===id);
                if (sp) { document.getElementById('speakerName').value = sp.name; document.getElementById('speakerPoints').value = sp.points; }
            };

            window.deleteSpeaker = async function(id) {
                if (await modalConfirm('Delete this speaker?','Confirm')) {
                    speakers = speakers.filter(s=>s.id!==id);
                    saveSpeakers();
                    renderAll();
                }
            };

            async function addOrUpdateSpeaker(name, points) {
                if (!name.trim()) { await modalAlert('Enter name'); return false; }
                const num = parseFloat(points);
                if (isNaN(num) || num<0 || num>90) { await modalAlert('Points 0-90'); return false; }
                const existing = speakers.findIndex(s => s.name.toLowerCase() === name.trim().toLowerCase());
                if (existing !== -1) {
                    speakers[existing].points = num;
                } else {
                    speakers.push({ id: Date.now()+'-'+Math.random().toString(36).substr(2,9), name: name.trim(), points: num });
                }
                saveSpeakers(); renderAll(); return true;
            }

            async function resetAll() {
                if (await modalConfirm('Delete all speakers?','Reset')) {
                    speakers = [];
                    saveSpeakers(); renderAll();
                }
            }

            // ---------- PROGRESS VIEW (teams in rounds) ----------
            function renderProgress() {
                const bracket = document.getElementById('bracketContainer');
                const rounds = [
                    { key: 'prelim1', name: 'Preliminary 1' },
                    { key: 'prelim2', name: 'Preliminary 2' },
                    { key: 'prelim3', name: 'Preliminary 3' },
                    { key: 'octa', name: 'Octa‑final' },
                    { key: 'quarter', name: 'Quarter‑final' },
                    { key: 'semi', name: 'Semi‑final' },
                    { key: 'final', name: 'Final' }
                ];

                let html = '';
                rounds.forEach(r => {
                    const assignedTeamIds = roundAssignments[r.key] || [];
                    const assignedTeams = assignedTeamIds.map(id => teams.find(t => t.id === id)).filter(t => t);
                    html += `<div class="round-card">
                        <h4>${r.name} <button onclick="addTeamToRound('${r.key}')" title="Add team"><i class="fa-solid fa-plus"></i></button></h4>
                        <ul class="round-teams">`;
                    if (assignedTeams.length === 0) {
                        html += '<li style="color:#aaa; text-align:center;">— empty —</li>';
                    } else {
                        assignedTeams.forEach(team => {
                            const memberList = team.members.map(m => `${m.name} (${m.points.toFixed(1)})`).join(', ');
                            html += `<li>
                                <div class="team-summary">
                                    <span class="team-name"><strong>${escapeHtml(team.name)}</strong></span>
                                    <button class="remove-team-btn" onclick="removeTeamFromRound('${r.key}', '${team.id}')" title="Remove team"><i class="fa-regular fa-trash-can"></i></button>
                                </div>
                                <div class="team-members-preview">
                                    ${team.members.map(m => `<span class="member-preview">${escapeHtml(m.name)} (${m.points.toFixed(1)})</span>`).join('')}
                                </div>
                            </li>`;
                        });
                    }
                    html += `</ul></div>`;
                });
                bracket.innerHTML = html;
            }

            // Add team to round
            window.addTeamToRound = async function(roundKey) {
                if (teams.length === 0) {
                    await modalAlert('No teams available. Create teams first.', 'Cannot add');
                    return;
                }
                const options = teams.map(t => ({ value: t.id, label: `${t.name} (${t.members.length} members)` }));
                const selectedId = await modalSelectPrompt('Select team to add:', options, `Add to ${roundKey}`);
                if (selectedId) {
                    if (!roundAssignments[roundKey]) roundAssignments[roundKey] = [];
                    if (!roundAssignments[roundKey].includes(selectedId)) {
                        roundAssignments[roundKey].push(selectedId);
                        saveRounds();
                        renderProgress();
                    } else {
                        await modalAlert('Team already in this round.', 'Duplicate');
                    }
                }
            };

            // Remove team from round
            window.removeTeamFromRound = async function(roundKey, teamId) {
                if (await modalConfirm('Remove this team from the round?', 'Confirm')) {
                    roundAssignments[roundKey] = roundAssignments[roundKey].filter(id => id !== teamId);
                    saveRounds();
                    renderProgress();
                }
            };

            // ---------- RENDER ALL ----------
            function renderAll() {
                renderMiniPodium();
                renderSidebarStats();
                renderTeams();
                renderTop3();
                renderTop10();
                renderFullTable();
                renderProgress();
            }

            // ---------- TAB SWITCHING ----------
            const tabRankings = document.getElementById('tabRankings');
            const tabProgress = document.getElementById('tabProgress');
            const rankingsView = document.getElementById('rankingsView');
            const progressView = document.getElementById('progressView');

            tabRankings.addEventListener('click', () => {
                tabRankings.classList.add('active');
                tabProgress.classList.remove('active');
                rankingsView.style.display = 'block';
                progressView.style.display = 'none';
            });
            tabProgress.addEventListener('click', () => {
                tabProgress.classList.add('active');
                tabRankings.classList.remove('active');
                rankingsView.style.display = 'none';
                progressView.style.display = 'block';
                renderProgress();
            });

            // ---------- SIDEBAR COLLAPSE ----------
            const sidebar = document.getElementById('sidebar');
            const toggleIcon = document.getElementById('toggleIcon');
            document.getElementById('toggleSidebar').addEventListener('click', () => {
                sidebar.classList.toggle('collapsed');
                if (sidebar.classList.contains('collapsed')) {
                    toggleIcon.classList.remove('fa-chevron-left');
                    toggleIcon.classList.add('fa-chevron-right');
                } else {
                    toggleIcon.classList.remove('fa-chevron-right');
                    toggleIcon.classList.add('fa-chevron-left');
                }
            });

            // ---------- EVENT LISTENERS ----------
            document.getElementById('addBtn').addEventListener('click', async function() {
                const name = document.getElementById('speakerName').value;
                const pts = document.getElementById('speakerPoints').value;
                if (await addOrUpdateSpeaker(name, pts)) {
                    document.getElementById('speakerName').value = '';
                    document.getElementById('speakerPoints').value = '0';
                }
            });
            document.getElementById('speakerName').addEventListener('keypress', e => e.key==='Enter' && document.getElementById('addBtn').click());
            document.getElementById('speakerPoints').addEventListener('keypress', e => e.key==='Enter' && document.getElementById('addBtn').click());
            document.getElementById('resetBtn').addEventListener('click', resetAll);

            // Initial render
            renderAll();
        })();
    </script>
</body>
</html>
