<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debate Tracker - 3 Member Teams</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #1e293b;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 i {
            color: #f97316;
            font-size: 28px;
        }

        .header-badge {
            background: #f97316;
            color: white;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 14px;
        }

        /* Main layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        /* Sidebar */
        .sidebar {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            height: fit-content;
        }

        .sidebar h2 {
            color: #1e293b;
            font-size: 18px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar h2 i {
            color: #f97316;
        }

        .stats-card {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #64748b;
            font-weight: 500;
        }

        .stat-value {
            color: #1e293b;
            font-weight: 700;
            font-size: 18px;
        }

        .top3-mini {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .top3-mini h3 {
            color: #1e293b;
            font-size: 16px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .top3-mini-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: white;
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid #e2e8f0;
        }

        .top3-mini-rank {
            color: #f97316;
            font-weight: 700;
            width: 30px;
        }

        .top3-mini-name {
            flex: 1;
            font-weight: 500;
        }

        .top3-mini-points {
            background: #f97316;
            color: white;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Teams section */
        .teams-section {
            margin-top: 20px;
        }

        .teams-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .teams-header h3 {
            color: #1e293b;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-add-team {
            background: #f97316;
            color: white;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .btn-add-team:hover {
            background: #ea580c;
            transform: scale(1.05);
        }

        .team-card {
            background: #f8fafc;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #e2e8f0;
        }

        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .team-name {
            font-weight: 700;
            color: #1e293b;
            background: white;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #f97316;
        }

        .team-actions button {
            background: none;
            border: none;
            color: #64748b;
            font-size: 14px;
            margin-left: 8px;
            cursor: pointer;
        }

        .team-actions button:hover {
            color: #f97316;
        }

        .member-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 6px;
            border: 1px solid #e2e8f0;
        }

        .member-number {
            color: #f97316;
            font-weight: 600;
            font-size: 12px;
            width: 24px;
        }

        .member-name {
            flex: 1;
            font-weight: 500;
        }

        .member-points {
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .member-edit {
            color: #64748b;
            background: none;
            border: none;
            cursor: pointer;
        }

        .member-edit:hover {
            color: #f97316;
        }

        /* Main content */
        .main-content {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }

        .tab {
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            background: #f1f5f9;
            color: #475569;
            border: none;
            font-size: 14px;
        }

        .tab.active {
            background: #f97316;
            color: white;
        }

        .tab:hover {
            background: #e2e8f0;
        }

        .tab.active:hover {
            background: #ea580c;
        }

        /* Speaker input form */
        .speaker-form {
            background: #f8fafc;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f97316;
        }

        .btn-submit {
            background: #f97316;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-submit:hover {
            background: #ea580c;
        }

        /* Top sections */
        .top-section {
            background: #f8fafc;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .top-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .top-header h3 {
            color: #1e293b;
            font-size: 18px;
        }

        .top-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .top-item {
            background: white;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-rank {
            font-size: 24px;
            font-weight: 800;
            color: #f97316;
            min-width: 40px;
        }

        .top-info {
            flex: 1;
        }

        .top-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .top-score {
            color: #64748b;
            font-size: 14px;
        }

        /* Leaderboard table */
        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .leaderboard-header h2 {
            color: #1e293b;
            font-size: 18px;
        }

        .btn-reset {
            background: none;
            border: 2px solid #e2e8f0;
            color: #64748b;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-reset:hover {
            border-color: #f97316;
            color: #f97316;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8fafc;
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: #475569;
            font-size: 13px;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #e2e8f0;
        }

        .rank-cell {
            font-weight: 700;
            color: #f97316;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-edit, .btn-delete {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-edit {
            color: #3b82f6;
        }

        .btn-delete {
            color: #ef4444;
        }

        /* Round cards */
        .rounds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .round-card {
            background: #f8fafc;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #e2e8f0;
        }

        .round-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px dashed #f97316;
        }

        .round-header h4 {
            color: #1e293b;
            font-weight: 700;
        }

        .btn-add-team-round {
            background: none;
            border: none;
            color: #f97316;
            font-size: 18px;
            cursor: pointer;
        }

        .team-list {
            list-style: none;
        }

        .team-list li {
            background: white;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid #e2e8f0;
        }

        .team-list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .team-list-name {
            font-weight: 600;
        }

        .btn-remove-team {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
        }

        .team-members-preview {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 12px;
        }

        .member-tag {
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 12px;
            color: #475569;
        }

        /* Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 28px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h3 {
            color: #1e293b;
            margin-bottom: 20px;
            font-size: 22px;
        }

        .modal-field {
            margin-bottom: 16px;
        }

        .modal-field label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #475569;
        }

        .modal-field input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
        }

        .modal-field input:focus {
            outline: none;
            border-color: #f97316;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .modal-btn {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .modal-btn-primary {
            background: #f97316;
            color: white;
        }

        .modal-btn-primary:hover {
            background: #ea580c;
        }

        .modal-btn-secondary {
            background: #f1f5f9;
            color: #475569;
        }

        .modal-btn-secondary:hover {
            background: #e2e8f0;
        }

        .empty-state {
            color: #94a3b8;
            text-align: center;
            padding: 40px;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <i class="fas fa-microphone-alt"></i>
                Debate Competition Tracker
            </h1>
            <div class="header-badge">
                <i class="fas fa-users"></i> 3-Member Teams
            </div>
        </div>

        <!-- Main Dashboard -->
        <div class="dashboard-grid">
            <!-- Sidebar -->
            <aside class="sidebar">
                <h2>
                    <i class="fas fa-chart-simple"></i>
                    Dashboard
                </h2>

                <!-- Stats -->
                <div class="stats-card">
                    <div class="stat-row">
                        <span class="stat-label">Total Speakers</span>
                        <span class="stat-value" id="totalSpeakers">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Total Points</span>
                        <span class="stat-value" id="totalPoints">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Average</span>
                        <span class="stat-value" id="averagePoints">0</span>
                    </div>
                </div>

                <!-- Top 3 Mini -->
                <div class="top3-mini">
                    <h3>
                        <i class="fas fa-crown" style="color: #f97316;"></i>
                        Top 3 Speakers
                    </h3>
                    <div id="miniTop3"></div>
                </div>

                <!-- Teams Section -->
                <div class="teams-section">
                    <div class="teams-header">
                        <h3>
                            <i class="fas fa-people-group"></i>
                            Teams
                        </h3>
                        <button class="btn-add-team" id="addTeamBtn" title="Add new team">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                    <div id="teamsList"></div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab active" id="tabSpeakers">
                        <i class="fas fa-user"></i> Speakers
                    </button>
                    <button class="tab" id="tabRounds">
                        <i class="fas fa-diagram-project"></i> Round Assignments
                    </button>
                </div>

                <!-- Speakers View -->
                <div id="speakersView">
                    <!-- Add Speaker Form -->
                    <div class="speaker-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Speaker Name</label>
                                <input type="text" id="speakerNameInput" placeholder="Enter name...">
                            </div>
                            <div class="form-group">
                                <label>Points (0-90)</label>
                                <input type="number" id="speakerPointsInput" min="0" max="90" step="0.1" value="0">
                            </div>
                            <button class="btn-submit" id="addSpeakerBtn">
                                <i class="fas fa-plus"></i> Add / Update
                            </button>
                        </div>
                    </div>

                    <!-- Top 3 Speakers -->
                    <div class="top-section">
                        <div class="top-header">
                            <i class="fas fa-crown" style="color: #f97316; font-size: 20px;"></i>
                            <h3>Top 3 Speakers</h3>
                        </div>
                        <div class="top-grid" id="top3Grid"></div>
                    </div>

                    <!-- Top 10 Speakers -->
                    <div class="top-section">
                        <div class="top-header">
                            <i class="fas fa-trophy" style="color: #f97316; font-size: 20px;"></i>
                            <h3>Top 10 Speakers</h3>
                        </div>
                        <div class="top-grid" id="top10Grid"></div>
                    </div>

                    <!-- All Speakers -->
                    <div class="leaderboard-header">
                        <h2><i class="fas fa-list"></i> All Speakers</h2>
                        <button class="btn-reset" id="resetAllBtn">
                            <i class="fas fa-trash-can"></i> Reset All
                        </button>
                    </div>
                    <div class="table-container" id="speakersTable"></div>
                </div>

                <!-- Rounds View (hidden by default) -->
                <div id="roundsView" style="display: none;">
                    <h2 style="margin-bottom: 20px;">
                        <i class="fas fa-diagram-project"></i> Team Round Assignments
                    </h2>
                    <div class="rounds-grid" id="roundsContainer"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- Team Modal -->
    <div class="modal" id="teamModal">
        <div class="modal-content">
            <h3 id="teamModalTitle">Add Team</h3>
            <div class="modal-field">
                <label>Team Name</label>
                <input type="text" id="teamNameInput" placeholder="e.g., Debate Team A">
            </div>
            
            <div style="margin: 20px 0 10px; color: #f97316; font-weight: 600;">
                <i class="fas fa-user"></i> Members (up to 3)
            </div>
            
            <!-- Member 1 -->
            <div class="modal-field">
                <label>Member 1 Name</label>
                <input type="text" id="member1Name" placeholder="Name">
            </div>
            <div class="modal-field">
                <label>Member 1 Points</label>
                <input type="number" id="member1Points" min="0" max="90" step="0.1" value="0">
            </div>
            
            <!-- Member 2 -->
            <div class="modal-field">
                <label>Member 2 Name</label>
                <input type="text" id="member2Name" placeholder="Name (optional)">
            </div>
            <div class="modal-field">
                <label>Member 2 Points</label>
                <input type="number" id="member2Points" min="0" max="90" step="0.1" value="0">
            </div>
            
            <!-- Member 3 -->
            <div class="modal-field">
                <label>Member 3 Name</label>
                <input type="text" id="member3Name" placeholder="Name (optional)">
            </div>
            <div class="modal-field">
                <label>Member 3 Points</label>
                <input type="number" id="member3Points" min="0" max="90" step="0.1" value="0">
            </div>
            
            <div class="modal-actions">
                <button class="modal-btn modal-btn-secondary" id="cancelTeamBtn">Cancel</button>
                <button class="modal-btn modal-btn-primary" id="saveTeamBtn">Save Team</button>
            </div>
        </div>
    </div>

    <!-- Alert Modal -->
    <div class="modal" id="alertModal">
        <div class="modal-content">
            <h3 id="alertTitle">Notice</h3>
            <p id="alertMessage" style="margin: 20px 0;"></p>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-primary" id="alertOkBtn">OK</button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div class="modal" id="confirmModal">
        <div class="modal-content">
            <h3 id="confirmTitle">Confirm</h3>
            <p id="confirmMessage" style="margin: 20px 0;"></p>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-secondary" id="confirmNoBtn">Cancel</button>
                <button class="modal-btn modal-btn-primary" id="confirmYesBtn">Yes</button>
            </div>
        </div>
    </div>

    <!-- Select Team Modal -->
    <div class="modal" id="selectTeamModal">
        <div class="modal-content">
            <h3 id="selectTeamTitle">Select Team</h3>
            <p id="selectTeamMessage" style="margin: 10px 0;"></p>
            <div class="modal-field">
                <select id="teamSelect" style="width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #e2e8f0;"></select>
            </div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-secondary" id="selectTeamCancelBtn">Cancel</button>
                <button class="modal-btn modal-btn-primary" id="selectTeamConfirmBtn">Select</button>
            </div>
        </div>
    </div>

    <script>
        // Data Storage
        let speakers = [];
        let teams = [];
        let roundAssignments = {
            prelim1: [], prelim2: [], prelim3: [],
            octa: [], quarter: [], semi: [], final: []
        };

        // Load from localStorage
        function loadData() {
            try {
                const savedSpeakers = localStorage.getItem('speakers');
                if (savedSpeakers) speakers = JSON.parse(savedSpeakers);
                
                const savedTeams = localStorage.getItem('teams');
                if (savedTeams) teams = JSON.parse(savedTeams);
                
                const savedRounds = localStorage.getItem('rounds');
                if (savedRounds) roundAssignments = JSON.parse(savedRounds);
            } catch (e) {
                console.error('Error loading data:', e);
            }
        }
        loadData();

        // Save functions
        function saveSpeakers() { localStorage.setItem('speakers', JSON.stringify(speakers)); }
        function saveTeams() { localStorage.setItem('teams', JSON.stringify(teams)); }
        function saveRounds() { localStorage.setItem('rounds', JSON.stringify(roundAssignments)); }

        // Modal functions
        function showAlert(message, title = 'Notice') {
            document.getElementById('alertTitle').textContent = title;
            document.getElementById('alertMessage').textContent = message;
            document.getElementById('alertModal').classList.add('active');
        }

        function hideAlert() {
            document.getElementById('alertModal').classList.remove('active');
        }

        function showConfirm(message, title = 'Confirm') {
            return new Promise(resolve => {
                document.getElementById('confirmTitle').textContent = title;
                document.getElementById('confirmMessage').textContent = message;
                document.getElementById('confirmModal').classList.add('active');
                
                const yesHandler = () => {
                    document.getElementById('confirmModal').classList.remove('active');
                    document.getElementById('confirmYesBtn').removeEventListener('click', yesHandler);
                    document.getElementById('confirmNoBtn').removeEventListener('click', noHandler);
                    resolve(true);
                };
                
                const noHandler = () => {
                    document.getElementById('confirmModal').classList.remove('active');
                    document.getElementById('confirmYesBtn').removeEventListener('click', yesHandler);
                    document.getElementById('confirmNoBtn').removeEventListener('click', noHandler);
                    resolve(false);
                };
                
                document.getElementById('confirmYesBtn').addEventListener('click', yesHandler);
                document.getElementById('confirmNoBtn').addEventListener('click', noHandler);
            });
        }

        function showTeamSelect(options, message = 'Select a team:', title = 'Add to Round') {
            return new Promise(resolve => {
                document.getElementById('selectTeamTitle').textContent = title;
                document.getElementById('selectTeamMessage').textContent = message;
                
                const select = document.getElementById('teamSelect');
                select.innerHTML = '';
                options.forEach(opt => {
                    const option = document.createElement('option');
                    option.value = opt.value;
                    option.textContent = opt.label;
                    select.appendChild(option);
                });
                
                document.getElementById('selectTeamModal').classList.add('active');
                
                const confirmHandler = () => {
                    const value = select.value;
                    document.getElementById('selectTeamModal').classList.remove('active');
                    document.getElementById('selectTeamConfirmBtn').removeEventListener('click', confirmHandler);
                    document.getElementById('selectTeamCancelBtn').removeEventListener('click', cancelHandler);
                    resolve(value);
                };
                
                const cancelHandler = () => {
                    document.getElementById('selectTeamModal').classList.remove('active');
                    document.getElementById('selectTeamConfirmBtn').removeEventListener('click', confirmHandler);
                    document.getElementById('selectTeamCancelBtn').removeEventListener('click', cancelHandler);
                    resolve(null);
                };
                
                document.getElementById('selectTeamConfirmBtn').addEventListener('click', confirmHandler);
                document.getElementById('selectTeamCancelBtn').addEventListener('click', cancelHandler);
            });
        }

        // Close modals
        document.getElementById('alertOkBtn').addEventListener('click', hideAlert);

        // Render Dashboard Stats
        function renderStats() {
            const total = speakers.length;
            const totalPoints = speakers.reduce((sum, s) => sum + s.points, 0);
            const avg = total ? (totalPoints / total).toFixed(1) : 0;
            
            document.getElementById('totalSpeakers').textContent = total;
            document.getElementById('totalPoints').textContent = totalPoints.toFixed(1);
            document.getElementById('averagePoints').textContent = avg;
        }

        // Render Mini Top 3
        function renderMiniTop3() {
            const sorted = [...speakers].sort((a, b) => b.points - a.points).slice(0, 3);
            const container = document.getElementById('miniTop3');
            
            if (sorted.length === 0) {
                container.innerHTML = '<p style="color: #94a3b8; text-align: center;">No speakers yet</p>';
                return;
            }
            
            container.innerHTML = sorted.map((s, i) => `
                <div class="top3-mini-item">
                    <span class="top3-mini-rank">#${i + 1}</span>
                    <span class="top3-mini-name">${escapeHtml(s.name)}</span>
                    <span class="top3-mini-points">${s.points.toFixed(1)}</span>
                </div>
            `).join('');
        }

        // Render Teams
        function renderTeams() {
            const container = document.getElementById('teamsList');
            
            if (teams.length === 0) {
                container.innerHTML = '<p style="color: #94a3b8; text-align: center;">No teams yet. Click + to add.</p>';
                return;
            }
            
            container.innerHTML = teams.map(team => {
                const members = team.members || [];
                return `
                    <div class="team-card">
                        <div class="team-header">
                            <span class="team-name">${escapeHtml(team.name)}</span>
                            <div class="team-actions">
                                <button onclick="editTeam('${team.id}')" title="Edit team">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button onclick="deleteTeam('${team.id}')" title="Delete team">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <div class="team-members">
                            ${renderMemberSlots(members)}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderMemberSlots(members) {
            const slots = [];
            for (let i = 0; i < 3; i++) {
                if (i < members.length) {
                    slots.push(`
                        <div class="member-row">
                            <span class="member-number">#${i + 1}</span>
                            <span class="member-name">${escapeHtml(members[i].name)}</span>
                            <span class="member-points">${members[i].points.toFixed(1)}</span>
                            <button class="member-edit" onclick="editTeam('${members[i].teamId}')" title="Edit">
                                <i class="fas fa-pen"></i>
                            </button>
                        </div>
                    `);
                } else {
                    slots.push(`
                        <div class="member-row" style="opacity: 0.6;">
                            <span class="member-number">#${i + 1}</span>
                            <span class="member-name">— Empty —</span>
                            <span class="member-points">—</span>
                            <button class="member-edit" onclick="editTeam('${members[i]?.teamId}')" title="Add">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    `);
                }
            }
            return slots.join('');
        }

        // Render Top 3 Grid
        function renderTop3() {
            const sorted = [...speakers].sort((a, b) => b.points - a.points).slice(0, 3);
            const grid = document.getElementById('top3Grid');
            
            if (sorted.length === 0) {
                grid.innerHTML = '<p style="color: #94a3b8;">No speakers yet</p>';
                return;
            }
            
            grid.innerHTML = sorted.map((s, i) => `
                <div class="top-item">
                    <span class="top-rank">#${i + 1}</span>
                    <div class="top-info">
                        <div class="top-name">${escapeHtml(s.name)}</div>
                        <div class="top-score">${s.points.toFixed(1)} points</div>
                    </div>
                </div>
            `).join('');
        }

        // Render Top 10 Grid
        function renderTop10() {
            const sorted = [...speakers].sort((a, b) => b.points - a.points).slice(0, 10);
            const grid = document.getElementById('top10Grid');
            
            if (sorted.length === 0) {
                grid.innerHTML = '<p style="color: #94a3b8;">No speakers yet</p>';
                return;
            }
            
            grid.innerHTML = sorted.map((s, i) => `
                <div class="top-item">
                    <span class="top-rank">#${i + 1}</span>
                    <div class="top-info">
                        <div class="top-name">${escapeHtml(s.name)}</div>
                        <div class="top-score">${s.points.toFixed(1)} pts</div>
                    </div>
                </div>
            `).join('');
        }

        // Render Full Speakers Table
        function renderSpeakersTable() {
            const sorted = [...speakers].sort((a, b) => b.points - a.points);
            const container = document.getElementById('speakersTable');
            
            if (sorted.length === 0) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-microphone"></i> No speakers yet. Add one above!</div>';
                return;
            }
            
            container.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Speaker</th>
                            <th>Points</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${sorted.map((s, i) => `
                            <tr>
                                <td class="rank-cell">#${i + 1}</td>
                                <td>${escapeHtml(s.name)}</td>
                                <td>${s.points.toFixed(1)}</td>
                                <td>
                                    <div class="action-buttons">
                                        <button class="btn-edit" onclick="editSpeaker('${s.id}')" title="Edit">
                                            <i class="fas fa-edit"></i>
                                        </button>
                                        <button class="btn-delete" onclick="deleteSpeaker('${s.id}')" title="Delete">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // Render Rounds
        function renderRounds() {
            const rounds = [
                { key: 'prelim1', name: 'Preliminary 1' },
                { key: 'prelim2', name: 'Preliminary 2' },
                { key: 'prelim3', name: 'Preliminary 3' },
                { key: 'octa', name: 'Octa-final' },
                { key: 'quarter', name: 'Quarter-final' },
                { key: 'semi', name: 'Semi-final' },
                { key: 'final', name: 'Final' }
            ];
            
            const container = document.getElementById('roundsContainer');
            
            container.innerHTML = rounds.map(round => {
                const assignedTeams = (roundAssignments[round.key] || [])
                    .map(id => teams.find(t => t.id === id))
                    .filter(t => t);
                
                return `
                    <div class="round-card">
                        <div class="round-header">
                            <h4>${round.name}</h4>
                            <button class="btn-add-team-round" onclick="addTeamToRound('${round.key}')" title="Add team">
                                <i class="fas fa-plus-circle"></i>
                            </button>
                        </div>
                        <ul class="team-list">
                            ${assignedTeams.length === 0 ? 
                                '<li style="color: #94a3b8; text-align: center;">No teams assigned</li>' : 
                                assignedTeams.map(team => `
                                    <li>
                                        <div class="team-list-item">
                                            <span class="team-list-name">${escapeHtml(team.name)}</span>
                                            <button class="btn-remove-team" onclick="removeTeamFromRound('${round.key}', '${team.id}')" title="Remove">
                                                <i class="fas fa-times"></i>
                                            </button>
                                        </div>
                                        <div class="team-members-preview">
                                            ${team.members.map(m => `
                                                <span class="member-tag">${escapeHtml(m.name)} (${m.points.toFixed(1)})</span>
                                            `).join('')}
                                        </div>
                                    </li>
                                `).join('')
                            }
                        </ul>
                    </div>
                `;
            }).join('');
        }

        // Helper: Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Speaker Functions
        window.editSpeaker = function(id) {
            const speaker = speakers.find(s => s.id === id);
            if (speaker) {
                document.getElementById('speakerNameInput').value = speaker.name;
                document.getElementById('speakerPointsInput').value = speaker.points;
            }
        };

        window.deleteSpeaker = async function(id) {
            if (await showConfirm('Delete this speaker?')) {
                speakers = speakers.filter(s => s.id !== id);
                saveSpeakers();
                renderAll();
            }
        };

        // Team Functions
        window.editTeam = function(id) {
            const team = teams.find(t => t.id === id);
            if (team) {
                currentTeamId = id;
                document.getElementById('teamModalTitle').textContent = 'Edit Team';
                document.getElementById('teamNameInput').value = team.name || '';
                
                const members = team.members || [];
                document.getElementById('member1Name').value = members[0]?.name || '';
                document.getElementById('member1Points').value = members[0]?.points || 0;
                document.getElementById('member2Name').value = members[1]?.name || '';
                document.getElementById('member2Points').value = members[1]?.points || 0;
                document.getElementById('member3Name').value = members[2]?.name || '';
                document.getElementById('member3Points').value = members[2]?.points || 0;
                
                document.getElementById('teamModal').classList.add('active');
            }
        };

        window.deleteTeam = async function(id) {
            if (await showConfirm('Delete this team?')) {
                // Remove from rounds
                for (let round in roundAssignments) {
                    roundAssignments[round] = roundAssignments[round].filter(tid => tid !== id);
                }
                teams = teams.filter(t => t.id !== id);
                saveTeams();
                saveRounds();
                renderAll();
            }
        };

        // Round Functions
        window.addTeamToRound = async function(roundKey) {
            if (teams.length === 0) {
                showAlert('No teams available. Create teams first.');
                return;
            }
            
            const options = teams.map(t => ({
                value: t.id,
                label: `${t.name} (${t.members.length} members)`
            }));
            
            const selectedId = await showTeamSelect(options, 'Select a team to add:', `Add to ${roundKey}`);
            
            if (selectedId) {
                if (!roundAssignments[roundKey].includes(selectedId)) {
                    roundAssignments[roundKey].push(selectedId);
                    saveRounds();
                    renderRounds();
                } else {
                    showAlert('Team already in this round.');
                }
            }
        };

        window.removeTeamFromRound = async function(roundKey, teamId) {
            if (await showConfirm('Remove this team from the round?')) {
                roundAssignments[roundKey] = roundAssignments[roundKey].filter(id => id !== teamId);
                saveRounds();
                renderRounds();
            }
        };

        // Render All
        function renderAll() {
            renderStats();
            renderMiniTop3();
            renderTeams();
            renderTop3();
            renderTop10();
            renderSpeakersTable();
            renderRounds();
        }

        // Team Modal
        const teamModal = document.getElementById('teamModal');
        let currentTeamId = null;

        document.getElementById('addTeamBtn').addEventListener('click', () => {
            currentTeamId = null;
            document.getElementById('teamModalTitle').textContent = 'Add New Team';
            document.getElementById('teamNameInput').value = '';
            document.getElementById('member1Name').value = '';
            document.getElementById('member1Points').value = 0;
            document.getElementById('member2Name').value = '';
            document.getElementById('member2Points').value = 0;
            document.getElementById('member3Name').value = '';
            document.getElementById('member3Points').value = 0;
            teamModal.classList.add('active');
        });

        document.getElementById('cancelTeamBtn').addEventListener('click', () => {
            teamModal.classList.remove('active');
        });

        document.getElementById('saveTeamBtn').addEventListener('click', () => {
            const teamName = document.getElementById('teamNameInput').value.trim();
            if (!teamName) {
                showAlert('Team name is required');
                return;
            }
            
            const members = [];
            
            if (document.getElementById('member1Name').value.trim()) {
                const points = parseFloat(document.getElementById('member1Points').value) || 0;
                if (points < 0 || points > 90) {
                    showAlert('Points for member 1 must be between 0 and 90');
                    return;
                }
                members.push({
                    name: document.getElementById('member1Name').value.trim(),
                    points: points
                });
            }
            
            if (document.getElementById('member2Name').value.trim()) {
                const points = parseFloat(document.getElementById('member2Points').value) || 0;
                if (points < 0 || points > 90) {
                    showAlert('Points for member 2 must be between 0 and 90');
                    return;
                }
                members.push({
                    name: document.getElementById('member2Name').value.trim(),
                    points: points
                });
            }
            
            if (document.getElementById('member3Name').value.trim()) {
                const points = parseFloat(document.getElementById('member3Points').value) || 0;
                if (points < 0 || points > 90) {
                    showAlert('Points for member 3 must be between 0 and 90');
                    return;
                }
                members.push({
                    name: document.getElementById('member3Name').value.trim(),
                    points: points
                });
            }
            
            if (currentTeamId) {
                // Edit existing
                const team = teams.find(t => t.id === currentTeamId);
                if (team) {
                    team.name = teamName;
                    team.members = members;
                }
            } else {
                // Add new
                teams.push({
                    id: Date.now() + '-' + Math.random().toString(36).substr(2, 6),
                    name: teamName,
                    members: members
                });
            }
            
            saveTeams();
            renderAll();
            teamModal.classList.remove('active');
        });

        // Add/Update Speaker
        document.getElementById('addSpeakerBtn').addEventListener('click', () => {
            const name = document.getElementById('speakerNameInput').value.trim();
            const points = parseFloat(document.getElementById('speakerPointsInput').value);
            
            if (!name) {
                showAlert('Please enter a speaker name');
                return;
            }
            
            if (isNaN(points) || points < 0 || points > 90) {
                showAlert('Points must be between 0 and 90');
                return;
            }
            
            const existingIndex = speakers.findIndex(s => s.name.toLowerCase() === name.toLowerCase());
            
            if (existingIndex !== -1) {
                speakers[existingIndex].points = points;
            } else {
                speakers.push({
                    id: Date.now() + '-' + Math.random().toString(36).substr(2, 6),
                    name: name,
                    points: points
                });
            }
            
            saveSpeakers();
            renderAll();
            
            // Clear form
            document.getElementById('speakerNameInput').value = '';
            document.getElementById('speakerPointsInput').value = 0;
        });

        // Reset All
        document.getElementById('resetAllBtn').addEventListener('click', async () => {
            if (await showConfirm('Delete all speakers?')) {
                speakers = [];
                saveSpeakers();
                renderAll();
            }
        });

        // Tab Switching
        const speakersTab = document.getElementById('tabSpeakers');
        const roundsTab = document.getElementById('tabRounds');
        const speakersView = document.getElementById('speakersView');
        const roundsView = document.getElementById('roundsView');

        speakersTab.addEventListener('click', () => {
            speakersTab.classList.add('active');
            roundsTab.classList.remove('active');
            speakersView.style.display = 'block';
            roundsView.style.display = 'none';
        });

        roundsTab.addEventListener('click', () => {
            roundsTab.classList.add('active');
            speakersTab.classList.remove('active');
            speakersView.style.display = 'none';
            roundsView.style.display = 'block';
            renderRounds();
        });

        // Initial render
        renderAll();
    </script>
</body>
</html>
