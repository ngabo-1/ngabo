<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDBATE COMPETITION · speaker rankings</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 1.5rem;
        }

        /* main container with sidebar + main */
        .app-container {
            display: flex;
            max-width: 1200px;
            width: 100%;
            gap: 1.5rem;
        }

        /* ---------- SIDEBAR (deep gray + orange) ---------- */
        .sidebar {
            flex: 1;
            max-width: 280px;
            background: #1e1e2e; /* deep gray */
            border-radius: 32px;
            padding: 2rem 1.5rem;
            color: #e0e0e0;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            height: fit-content;
        }

        .sidebar h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #f57c00; /* orange */
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sidebar h2 i {
            font-size: 2rem;
        }

        .stat-card-side {
            background: #2d2d3a;
            border-radius: 24px;
            padding: 1.2rem;
            margin-bottom: 1rem;
            border-left: 6px solid #f57c00;
        }

        .stat-side-value {
            font-size: 2rem;
            font-weight: 800;
            color: white;
        }

        .stat-side-label {
            color: #f57c00;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.03em;
        }

        .team-spotlight {
            background: #2d2d3a;
            border-radius: 24px;
            padding: 1.5rem 1rem;
            margin-top: 2rem;
        }

        .team-spotlight h3 {
            color: #f57c00;
            margin-bottom: 1rem;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .team-member {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e2e;
            border-radius: 40px;
            padding: 0.6rem 1rem;
            margin-bottom: 0.7rem;
        }

        .team-member .name {
            font-weight: 600;
            color: white;
        }

        .team-member .points {
            background: #f57c00;
            color: #1e1e2e;
            font-weight: 700;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            font-size: 0.85rem;
        }

        /* ---------- MAIN CONTENT ---------- */
        .main-content {
            flex: 3;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            padding: 2rem;
        }

        .main-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1e1e2e;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.25rem;
        }

        .main-header h1 i {
            color: #f57c00;
            font-size: 2.5rem;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 2rem;
            font-size: 1rem;
            border-left: 4px solid #f57c00;
            padding-left: 1rem;
        }

        /* Input section */
        .input-section {
            background: #f8fafc;
            border-radius: 24px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }

        .input-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: flex-end;
        }

        .input-field {
            flex: 2 1 200px;
        }

        .input-field label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: #475569;
            margin-bottom: 0.3rem;
        }

        .input-field input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border: 2px solid #e2e8f0;
            border-radius: 40px;
            font-size: 1rem;
            background: white;
            transition: 0.2s;
        }

        .input-field input:focus {
            outline: none;
            border-color: #f57c00;
            box-shadow: 0 0 0 3px rgba(245,158,11,0.2);
        }

        .points-field {
            flex: 1 1 120px;
        }

        .add-btn {
            flex: 0 0 auto;
            background: #f57c00;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 0.9rem 2rem;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 8px 20px rgba(245,158,11,0.3);
            height: 54px;
            white-space: nowrap;
        }

        .add-btn:hover {
            background: #e07c00;
        }

        .add-btn:active {
            transform: scale(0.97);
        }

        .info-note {
            font-size:0.85rem; color:#64748b; margin-top:0.75rem;
        }
        .info-note i {
            color: #f57c00;
        }

        /* Top 10 section */
        .top10-section {
            background: #f8fafc;
            border-radius: 24px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }

        .top10-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .top10-header h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1e1e2e;
        }

        .top10-header i {
            color: #f57c00;
            font-size: 1.5rem;
        }

        .top10-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 0.8rem;
        }

        .top10-item {
            background: white;
            border-radius: 40px;
            padding: 0.8rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            border: 1px solid #e2e8f0;
        }

        .top10-rank {
            font-weight: 800;
            color: #f57c00;
            font-size: 1.2rem;
            min-width: 2rem;
        }

        .top10-name {
            flex: 1;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .top10-points {
            font-weight: 700;
            color: #1e1e2e;
            background: #f1f5f9;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            font-size: 0.9rem;
        }

        /* Full leaderboard */
        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .leaderboard-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e1e2e;
        }

        .reset-btn {
            background: none;
            border: 2px solid #e2e8f0;
            color: #64748b;
            border-radius: 40px;
            padding: 0.5rem 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .reset-btn:hover {
            border-color: #f57c00;
            color: #f57c00;
            background: #fff7ed;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 20px;
            border: 1px solid #edf2f7;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #f8fafc;
            color: #334155;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            padding: 1rem 1rem;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
        }

        td {
            padding: 1rem 1rem;
            border-bottom: 1px solid #edf2f7;
            color: #1e293b;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .rank {
            font-weight: 800;
            color: #f57c00;
            width: 60px;
        }

        .name {
            font-weight: 600;
        }

        .points {
            font-weight: 700;
            color: #1e1e2e;
        }

        .actions {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .edit-btn, .delete-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
            padding: 0.3rem;
        }

        .edit-btn { color: #3b82f6; }
        .edit-btn:hover { color: #1e4f8a; }

        .delete-btn { color: #ef4444; }
        .delete-btn:hover { color: #b91c1c; }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #94a3b8;
            font-style: italic;
        }

        @media (max-width: 800px) {
            .app-container {
                flex-direction: column;
            }
            .sidebar {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- LEFT SIDEBAR (deep gray + orange) -->
        <aside class="sidebar">
            <h2>
                <i class="fa-regular fa-chart-bar"></i> DASHBOARD
            </h2>

            <!-- stats cards -->
            <div class="stat-card-side" id="sidebarStats">
                <!-- filled by JS -->
            </div>

            <!-- TEAM SPOTLIGHT (static team of three) -->
            <div class="team-spotlight">
                <h3><i class="fa-regular fa-users"></i> Team Phoenix</h3>
                <div class="team-member">
                    <span class="name">Alex Rivera</span>
                    <span class="points">89.5</span>
                </div>
                <div class="team-member">
                    <span class="name">Jordan Lee</span>
                    <span class="points">88.0</span>
                </div>
                <div class="team-member">
                    <span class="name">Casey Kim</span>
                    <span class="points">85.2</span>
                </div>
                <p style="color:#aaa; font-size:0.8rem; margin-top:0.8rem;">
                    <i class="fa-regular fa-circle-check" style="color:#f57c00;"></i> Max per speaker: 90
                </p>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <div class="main-header">
                <h1>
                    <i class="fa-regular fa-microphone"></i> IDBATE COMPETITION
                </h1>
                <div class="subtitle">
                    Add speakers (max 90 points) · Top 10 · Full leaderboard
                </div>
            </div>

            <!-- Add speaker form -->
            <div class="input-section">
                <div class="input-row">
                    <div class="input-field">
                        <label><i class="fa-regular fa-user"></i> Speaker name</label>
                        <input type="text" id="speakerName" placeholder="e.g., Jane Doe" autocomplete="off">
                    </div>
                    <div class="input-field points-field">
                        <label><i class="fa-regular fa-star"></i> Points (≤90)</label>
                        <input type="number" id="speakerPoints" placeholder="0" min="0" max="90" step="0.1" value="0">
                    </div>
                    <button class="add-btn" id="addBtn">
                        <i class="fa-solid fa-plus"></i> Add / Update
                    </button>
                </div>
                <div class="info-note">
                    <i class="fa-regular fa-circle-info"></i> Max 90 points per speaker. If name exists, points are updated.
                </div>
            </div>

            <!-- TOP 10 LIST -->
            <div class="top10-section">
                <div class="top10-header">
                    <i class="fa-solid fa-trophy"></i>
                    <h3>Top 10 speakers</h3>
                </div>
                <div class="top10-grid" id="top10Grid">
                    <!-- dynamic -->
                </div>
            </div>

            <!-- FULL LEADERBOARD -->
            <div class="leaderboard-header">
                <h2><i class="fa-regular fa-list"></i> All speakers</h2>
                <button class="reset-btn" id="resetBtn">
                    <i class="fa-regular fa-trash-can"></i> Reset all
                </button>
            </div>

            <div class="table-container" id="tableContainer">
                <!-- Dynamic table injected via JS -->
            </div>
        </main>
    </div>

    <script>
        (function() {
            const STORAGE_KEY = 'idbate_speakers';

            // Default data (some with points ≤90)
            let speakers = [
                { id: '1', name: 'Alex Rivera', points: 89.5 },
                { id: '2', name: 'Jordan Lee', points: 88.0 },
                { id: '3', name: 'Taylor Smith', points: 76.8 },
                { id: '4', name: 'Casey Kim', points: 85.2 },
                { id: '5', name: 'Morgan Chase', points: 81.3 },
                { id: '6', name: 'Riley Parker', points: 67.5 },
                { id: '7', name: 'Jamie Chen', points: 89.4 },
                { id: '8', name: 'Sam Johnson', points: 73.2 },
                { id: '9', name: 'Chris Evans', points: 84.7 },
                { id: '10', name: 'Pat Smith', points: 90.0 },
                { id: '11', name: 'Terry Gale', points: 62.3 }
            ];

            // Load from localStorage
            function loadSpeakers() {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try {
                        speakers = JSON.parse(stored);
                        speakers = speakers.filter(s => s && typeof s === 'object').map(s => {
                            if (!s.id) s.id = Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                            return s;
                        });
                    } catch (e) {
                        console.warn('Failed to load, using defaults');
                    }
                } else {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(speakers));
                }
            }

            function saveSpeakers() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(speakers));
            }

            // Escape helper
            function escapeHtml(unsafe) {
                return unsafe.replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            // Update sidebar stats
            function renderSidebarStats() {
                const totalSpeakers = speakers.length;
                const totalPoints = speakers.reduce((sum, s) => sum + s.points, 0);
                const avgPoints = totalSpeakers ? (totalPoints / totalSpeakers).toFixed(1) : 0;
                const maxPoints = speakers.length ? Math.max(...speakers.map(s => s.points)) : 0;
                const minPoints = speakers.length ? Math.min(...speakers.map(s => s.points)) : 0;

                const sidebarStats = document.getElementById('sidebarStats');
                sidebarStats.innerHTML = `
                    <div style="margin-bottom:1rem;">
                        <div class="stat-side-value">${totalSpeakers}</div>
                        <div class="stat-side-label">Total speakers</div>
                    </div>
                    <div style="margin-bottom:1rem;">
                        <div class="stat-side-value">${totalPoints.toFixed(1)}</div>
                        <div class="stat-side-label">Total points</div>
                    </div>
                    <div style="margin-bottom:1rem;">
                        <div class="stat-side-value">${avgPoints}</div>
                        <div class="stat-side-label">Average</div>
                    </div>
                    <div style="margin-bottom:1rem;">
                        <div class="stat-side-value">${maxPoints.toFixed(1)}</div>
                        <div class="stat-side-label">Highest</div>
                    </div>
                    <div>
                        <div class="stat-side-value">${minPoints.toFixed(1)}</div>
                        <div class="stat-side-label">Lowest</div>
                    </div>
                `;
            }

            // Render Top 10
            function renderTop10() {
                const sorted = [...speakers].sort((a, b) => b.points - a.points);
                const top10 = sorted.slice(0, 10);
                const grid = document.getElementById('top10Grid');

                if (top10.length === 0) {
                    grid.innerHTML = `<p style="color:#94a3b8; text-align:center;">No speakers yet.</p>`;
                    return;
                }

                grid.innerHTML = top10.map((speaker, idx) => {
                    const rank = idx + 1;
                    return `
                        <div class="top10-item">
                            <span class="top10-rank">#${rank}</span>
                            <span class="top10-name">${escapeHtml(speaker.name)}</span>
                            <span class="top10-points">${speaker.points.toFixed(1)}</span>
                        </div>
                    `;
                }).join('');
            }

            // Render full table
            function renderFullTable() {
                const sorted = [...speakers].sort((a, b) => b.points - a.points);
                const container = document.getElementById('tableContainer');

                if (sorted.length === 0) {
                    container.innerHTML = `<div class="empty-state"><i class="fa-regular fa-face-smile"></i> No speakers yet. Add one above!</div>`;
                    return;
                }

                let html = `<table>
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Speaker</th>
                            <th>Points</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>`;

                sorted.forEach((speaker, index) => {
                    const rank = index + 1;
                    html += `<tr data-id="${speaker.id}">
                        <td class="rank">#${rank}</td>
                        <td class="name">${escapeHtml(speaker.name)}</td>
                        <td class="points">${speaker.points.toFixed(1)}</td>
                        <td class="actions">
                            <button class="edit-btn" onclick="editSpeaker('${speaker.id}')" title="Edit"><i class="fa-regular fa-pen-to-square"></i></button>
                            <button class="delete-btn" onclick="deleteSpeaker('${speaker.id}')" title="Delete"><i class="fa-regular fa-trash-can"></i></button>
                        </td>
                    </tr>`;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;
            }

            // Re-render everything
            function renderAll() {
                renderSidebarStats();
                renderTop10();
                renderFullTable();
            }

            // Add or update speaker (with max 90 validation)
            function addOrUpdateSpeaker(name, points) {
                if (!name.trim()) {
                    alert('Please enter a speaker name.');
                    return false;
                }
                const numPoints = parseFloat(points);
                if (isNaN(numPoints) || numPoints < 0) {
                    alert('Points must be a non-negative number.');
                    return false;
                }
                if (numPoints > 90) {
                    alert('Maximum points allowed is 90.');
                    return false;
                }

                const existingIndex = speakers.findIndex(s => s.name.toLowerCase() === name.trim().toLowerCase());
                if (existingIndex !== -1) {
                    speakers[existingIndex].points = numPoints;
                } else {
                    speakers.push({
                        id: Date.now() + '-' + Math.random().toString(36).substr(2, 9),
                        name: name.trim(),
                        points: numPoints
                    });
                }
                saveSpeakers();
                renderAll();
                return true;
            }

            // Delete speaker
            window.deleteSpeaker = function(id) {
                speakers = speakers.filter(s => s.id !== id);
                saveSpeakers();
                renderAll();
            };

            // Edit speaker (populate form)
            window.editSpeaker = function(id) {
                const speaker = speakers.find(s => s.id === id);
                if (!speaker) return;
                document.getElementById('speakerName').value = speaker.name;
                document.getElementById('speakerPoints').value = speaker.points;
                document.getElementById('speakerName').focus();
            };

            // Reset all
            function resetAll() {
                if (confirm('Are you sure? This will delete all speakers.')) {
                    speakers = [];
                    saveSpeakers();
                    renderAll();
                    document.getElementById('speakerName').value = '';
                    document.getElementById('speakerPoints').value = '0';
                }
            }

            // Initial load
            loadSpeakers();
            renderAll();

            // Event listeners
            document.getElementById('addBtn').addEventListener('click', function() {
                const name = document.getElementById('speakerName').value;
                const points = document.getElementById('speakerPoints').value;
                if (addOrUpdateSpeaker(name, points)) {
                    document.getElementById('speakerName').value = '';
                    document.getElementById('speakerPoints').value = '0';
                }
            });

            document.getElementById('speakerName').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') document.getElementById('addBtn').click();
            });
            document.getElementById('speakerPoints').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') document.getElementById('addBtn').click();
            });

            document.getElementById('resetBtn').addEventListener('click', resetAll);

            // Expose functions globally
            window.editSpeaker = editSpeaker;
            window.deleteSpeaker = deleteSpeaker;
        })();
    </script>
</body>
</html>
